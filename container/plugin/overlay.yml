# dsh-container 容器适配插件 overlay: 在 web profile 树尾挂载本插件
# (/opt/dsh-container-plugin, 镜像所有, 随镜像升级; 绝对路径 name 由
# launcher 转成 file:// URL 加载, 不依赖用户区 node_modules)。
# 插件的运行期职责:
#   - 会话 cookie 自举(替代 dsh-web.sh 的 token 交换);
#   - 设置 > 打开配置文件(settings/openSettingsDocument)降级: 容器无桌面,
#     上游会 spawn xdg-open 报 ENOENT —— 禁用上游 settings-controller 行,
#     由插件注入 internals 提供友好降级(错误消息带下载链接);
#   - /download/settings.yaml 下载端点(requestRejection 鉴权)。
- id: settings-controller
  disabled: true
- insert:
    - id: dsh-container-adapt
      name: /opt/dsh-container-plugin/index.js
