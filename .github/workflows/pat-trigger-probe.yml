name: PAT trigger probe

# 验证 RELEASE_PAT 推送的 tag 能否触发 push-event workflow。GitHub 规则:
# fine-grained PAT 必须带 "Workflows: read and write" 仓库权限, 否则 git push
# 的 tag 不会产生任何 push event —— release-prep 的"推 tag 后确认 image.yml
# 已触发"步骤会因此失败(2026-09-08 dsh-v0.1.3-alpha.2 事故)。
#
# 用法: Actions → "PAT trigger probe" → "Run workflow"(手动 dispatch)。
# 流程:
#
#   dispatch run → 用 RELEASE_PAT 推 _pat-probe-<run_id> tag
#     → 轮询本 workflow 是否被该 push 触发(push 事件 run)
#     → 被触发的 run 自删探针 tag 并成功(证明闭环, 也是自清理)
#     → dispatch run 等它完结: PASS = 触发链路通; FAIL = 未触发或自清理失败
#
# FAIL 时会追加一步 Workflows 权限自测: 用 RELEASE_PAT 向一次性分支推送一个
# .github/workflows/ 下的文件 —— git 服务端对 workflow 文件改动有硬性权限
# 闸门, 不带 Workflows 权限的 PAT 会被显式拒收(报错直接说明缺什么权限),
# 带权限则接受。这一步能把"token 缺权限"和"别的怪异问题"区分开, 不用猜。
#
# FAIL 时探针 tag 留在仓库里便于排查(修好 PAT 后删除即可); 成功时零残留。
# tag 名带 run_id, 重复 dispatch 互不干扰, 也不会命中 image.yml/upstream-tag.yml
# 的 dsh-v* 过滤器。

on:
  workflow_dispatch:
  push:
    tags: ['_pat-probe-*']

permissions:
  contents: write # 删除探针 tag(GITHUB_TOKEN; delete 事件不触发 workflow)
  actions: read   # 轮询 Actions API

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch path — push probe tag and verify the trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT secret is not configured; nothing to verify" >&2
            exit 1
          fi
          tag="_pat-probe-${{ github.run_id }}"
          git tag "$tag"
          git remote add probe "https://oauth2:${RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git push probe "refs/tags/$tag"
          echo "pushed probe tag $tag"
          # 轮询: 本 workflow 应出现 event=push 且 head_branch=$tag 的新 run
          # (实测 push 事件到 run 创建可能有 1-2 分钟延迟, 轮询放宽到 5 分钟)
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh api "repos/${{ github.repository }}/actions/runs?event=push&per_page=10" \
                --jq -r --arg tag "$tag" \
                  '.workflow_runs[] | select(.path == ".github/workflows/pat-trigger-probe.yml" and .head_branch == $tag) | .id' \
                2>/dev/null | head -n1
            )" || true
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "FAIL: no push-triggered run appeared for $tag (polled ~300s)." >&2
            echo "Self-testing whether RELEASE_PAT carries the Workflows permission..." >&2
            # Workflows 权限自测: 向一次性分支推 .github/workflows/ 下新文件,
            # git 服务端对 workflow 文件改动强制校验该权限, 缺则拒收。
            wf_branch="_pat-probe-wf-${{ github.run_id }}"
            probe_file=".github/workflows/_pat-probe-${{ github.run_id }}.yml"
            git checkout -q -b "$wf_branch"
            printf 'name: probe\non: workflow_dispatch\njobs:\n  p:\n    runs-on: ubuntu-latest\n    steps:\n      - run: "true"\n' > "$probe_file"
            git add "$probe_file"
            git -c user.name="PAT trigger probe" -c user.email="actions@github.com" \
              commit -q -m "pat probe workflow file"
            if git push probe "refs/heads/$wf_branch" 2>/tmp/wf-push-err.txt; then
              echo "WORKFLOWS-PERMISSION: PRESENT (workflow-file push accepted)" >&2
              echo "=> But the tag push still created no run: consider using a CLASSIC PAT" >&2
              echo "   (with repo+workflow scopes) instead of a fine-grained one." >&2
            else
              echo "WORKFLOWS-PERMISSION: MISSING (workflow-file push rejected):" >&2
              tail -3 /tmp/wf-push-err.txt >&2
              echo "=> Grant the PAT the 'Workflows: read and write' repository permission," >&2
              echo "   or switch to a CLASSIC PAT with repo+workflow scopes." >&2
            fi
            # 无论结果都删掉一次性分支(delete 事件不触发 workflow)
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$wf_branch" \
              >/dev/null 2>&1 || true
            echo "The probe tag was left in the repository for inspection; delete it once the PAT is fixed." >&2
            exit 1
          fi
          echo "push-triggered run $run_id created; waiting for it to complete..."
          state="queued"
          for _ in $(seq 1 60); do
            state="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq -r '.status' 2>/dev/null || true)"
            [ "$state" = "completed" ] && break
            sleep 5
          done
          if [ "$state" != "completed" ]; then
            echo "FAIL: triggered run $run_id did not complete in time" >&2
            exit 1
          fi
          conclusion="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq -r '.conclusion')"
          if [ "$conclusion" = "success" ]; then
            echo "PROBE PASS: the $tag push created run $run_id, which cleaned up and succeeded — RELEASE_PAT can trigger push-event workflows."
          else
            echo "FAIL: triggered run $run_id concluded '$conclusion'" >&2
            exit 1
          fi

      - name: Push path — prove the trigger by removing the probe tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 能走到这里, 本身就证明 PAT 推送的 tag 触发了本 workflow。
          # 自清理: 删除自己的探针 tag(GITHUB_TOKEN 即可; 删除不触发 workflow)。
          tag="${{ github.ref_name }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" \
            || { echo "FAIL: could not delete probe tag $tag; remove it manually" >&2; exit 1; }
          echo "PROBE PASS: push-event run for $tag reached the worker; probe tag deleted."