name: Maintenance

# 周期性清理:
#   - Actions cache: 仓库配额默认 10 GB, 多个 mode=max 构建会把它顶满并互相驱逐;
#   - GHCR: 每次发布留下 dsh-v* / <sha> 两个 tag 和一份多架构索引, 旧的既不回滚也不该无限增长。
#
# 镜像清理必须"懂 manifest 图"。一个多架构镜像在 GHCR 里是: 1 个带 tag 的 index
# + 每平台 1 个子 manifest (+ attestation), 而子 manifest 天生就是 untagged version。
# 曾用 actions/delete-package-versions 的 delete-only-untagged-versions 清 untagged,
# 它把子 manifest 当垃圾删掉, 只留下空壳 index, 于是所有 tag 的 pull 全部 404
# (2026-11-23 的事故: 一次删掉 8 个 release 的 24 个子 manifest)。
# dataaxiom/ghcr-cleanup-action 先摘掉被索引引用的子项再套规则, 并在最后复核;
# 这里再补一步硬校验: 清理后每个 tag 的每个 child manifest 都必须还能解析。
#
# 手动 dispatch 可以随时跑; dry_run 只报告将删除的内容, 不动 registry ——
# 首次换用新清理器时先跑一次 dry_run 看清单。
on:
  schedule:
    - cron: "17 3 * * 1" # 每周一 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只报告将删除的内容, 不真的删除"
        type: boolean
        default: false

permissions:
  actions: write  # 删除 cache
  packages: write # 删除 GHCR 版本

# 定时任务和手动触发不能并发删除同一批 cache/package version。
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune Actions caches and old image versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete Actions caches not accessed in 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "deleting caches last accessed before $cutoff"
          ids="$(gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.last_accessed_at < \"$cutoff\") | .id")"
          if [ -z "$ids" ]; then
            echo "no stale caches"
            exit 0
          fi
          deleted=0
          failed=0
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "failed to delete cache $id" >&2
            fi
          done <<<"$ids"
          echo "deleted $deleted cache(s), $failed failed"
          [ "$failed" -eq 0 ] || exit 1

      # keep-n-tagged 按"镜像"计数(index 及其 tag 算一份), 不是按 GHCR version 计数 ——
      # 后者会把子 manifest 也算进去, 12 个 version 其实只有 3 个 release。
      # exclude-tags: latest 是兜底, 保证发布流水线的默认入口永远在。
      # older-than: 1 day 是防误杀 —— ghost 判定靠 404, 刚发布/刚合并的镜像在 registry
      # 里还没稳定时可能被误判; 一天内的镜像不参与任何删除判定, 下周再处理没有损失。
      - name: Prune image versions (multi-arch aware)
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: dsh-container
          keep-n-tagged: 6
          exclude-tags: latest
          delete-untagged: true
          delete-ghost-images: true
          older-than: 1 day
          validate: true
          dry-run: ${{ inputs.dry_run || 'false' }}

      # 事故防线: 清理后每个 tag 都必须还能 pull。只查 index 不够 ——
      # 出问题的永远是 index 引用的子 manifest, 必须逐个解析。
      - name: Verify every remaining tag still resolves
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 包是公开的, 匿名 pull token 足够; 改为私有包需要换成带凭据的 token。
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          token="$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
            | jq -r '.token')"
          registry="https://ghcr.io/v2/${repo}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          # $1 = tag 或 digest, $2 = 落盘文件; 打印 HTTP 状态码。
          fetch() {
            curl -sS -o "$2" -w '%{http_code}' \
              -H "Authorization: Bearer $token" -H "Accept: $accept" \
              "$registry/manifests/$1"
          }

          # tag 列表必须跟着 Link 头翻完: registry 的单页有上限, 只看第一页会漏检。
          : > "$RUNNER_TEMP/tags.txt"
          next="$registry/tags/list?n=1000"
          pages=0
          while [ -n "$next" ]; do
            pages=$((pages + 1))
            [ "$pages" -le 100 ] || { echo "::error::tag pagination did not terminate" >&2; exit 1; }
            curl -fsS -D "$RUNNER_TEMP/tags-headers.txt" -o "$RUNNER_TEMP/tags-page.json" \
              -H "Authorization: Bearer $token" "$next"
            jq -r '.tags[]?' "$RUNNER_TEMP/tags-page.json" >> "$RUNNER_TEMP/tags.txt"
            link="$(grep -i '^link:' "$RUNNER_TEMP/tags-headers.txt" | tr -d '\r' | tail -n1 || true)"
            # 同一行可能带多个 <url>; rel=..., 只取 rel="next" 那个。
            url="$(printf '%s' "$link" | tr ',' '\n' \
              | sed -n 's/.*<\([^>]*\)>.*rel="next".*/\1/p' | head -n1)"
            case "$url" in
              "") next="" ;;
              http://*|https://*) next="$url" ;;
              *) next="https://ghcr.io${url}" ;;
            esac
          done
          tags="$(sort -u "$RUNNER_TEMP/tags.txt")"
          [ -n "$tags" ] || { echo "::error::registry has no tags left after cleanup"; exit 1; }
          grep -qx 'latest' <<<"$tags" \
            || { echo "::error::the :latest tag is missing after cleanup"; exit 1; }

          failed=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            code="$(fetch "$tag" "$RUNNER_TEMP/manifest.json")"
            if [ "$code" != "200" ]; then
              echo "::error::tag $tag does not resolve (HTTP $code)" >&2
              failed=1
              continue
            fi
            while IFS= read -r child; do
              [ -n "$child" ] || continue
              code="$(fetch "$child" "$RUNNER_TEMP/child.json")"
              if [ "$code" != "200" ]; then
                echo "::error::$tag references $child, which is gone (HTTP $code)" >&2
                failed=1
              fi
            done < <(jq -r '(.manifests // [])[]?.digest' "$RUNNER_TEMP/manifest.json")
          done <<<"$tags"
          [ "$failed" -eq 0 ] || { echo "cleanup left at least one tag unpullable" >&2; exit 1; }
          echo "all $(wc -l <<<"$tags") tag(s) resolve with every child manifest present"
