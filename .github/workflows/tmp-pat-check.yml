name: PAT probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify RELEASE_PAT identity, repo access and contents write
        env:
          PAT: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json")

          echo '--- 1) token 有效性(GET /user) ---'
          code="$(curl -sS -o /tmp/user.json -w '%{http_code}' "${auth[@]}" https://api.github.com/user)"
          echo "GET /user -> $code"
          [ "$code" = 200 ] || { cat /tmp/user.json; exit 1; }
          jq -r '"login=\(.login) type=\(.type)"' /tmp/user.json

          echo '--- 2) 仓库访问(GET /repos/...) ---'
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "https://api.github.com/repos/$REPO")"
          echo "GET /repos/$REPO -> $code"
          [ "$code" = 200 ] || exit 1

          echo '--- 3) contents 写权限(创建探针 tag 后立即删除) ---'
          head_sha="$(curl -sS "${auth[@]}" "https://api.github.com/repos/$REPO/git/ref/heads/main" | jq -r .object.sha)"
          code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -X POST "${auth[@]}" \
            "https://api.github.com/repos/$REPO/git/refs" \
            -H 'content-type: application/json' \
            -d "{\"ref\":\"refs/tags/_pat-probe\",\"sha\":\"$head_sha\"}")"
          echo "POST git/refs (probe tag) -> $code"
          [ "$code" = 201 ] || { cat /tmp/ref.json; exit 1; }
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${auth[@]}" \
            "https://api.github.com/repos/$REPO/git/refs/tags/_pat-probe")"
          echo "DELETE probe tag -> $code"
          [ "$code" = 204 ] || exit 1
          echo 'PROBE PASS: PAT 有效, 仓库可访问, contents:write 生效'
