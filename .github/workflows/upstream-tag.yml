name: Upstream dsh tag watch

# 上游 dsh 的 dsh-v* tag 监视(Dependabot 没有"监视另一个仓库 git tag"的生态)。
# 每 6 小时对照 GitHub API:
#
#   - 上游出现本仓库尚未镜像的新 tag → 开 tracker issue, 并(配置了 RELEASE_PAT 时)
#     在 main 的 HEAD 上创建同名 tag 推上去 —— 这个 push 就是发布触发源, 发布
#     流水线 publish.yml 会跑 light → 双架构构建 → smoke → Release。
#   - 没有 PAT 时只留言手动命令(`git tag ... && git push ...`), 不自动发。
#   - 24 小时内该 tag 已经失败过一次发布 → 不重复建 tag, 只留言(避免每 6 小时
#     重跑一次双架构构建)。
#   - 已跟上上游 → 关闭 tracker issue(以 GitHub Release 是否存在为准);
#     并对最新 tag 做发布健康检查: 没有 Release 就开/留
#     "Release pipeline not published: <tag>" issue, 成功后自动关闭。
#
# 本文件只做"发现 + 建 tag + 报状态", 不构建、不发布。

on:
  schedule:
    # Actions 的 schedule 是尽力而为, 实测比名义时间晚 4-9 小时; 4 次/天把
    # 发现延迟压到 ~10-15 小时。
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    tags: ['dsh-v*']

permissions:
  contents: write # 创建/推送 tag(PAT 缺失时不会用到)
  issues: write
  actions: read # 查询 publish.yml 的运行结果

concurrency:
  group: upstream-tag-watch
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ${{ vars.DSH_UPSTREAM_REPO || 'deepseek-ai/deepseek-harness' }}

jobs:
  watch:
    name: Compare newest dsh-v* tags
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SELF_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare tags, tag the new release, report status
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          list_tags() { gh api --paginate "repos/$1/tags?per_page=100" --jq '.[].name'; }

          upstream_tags="$(list_tags "$UPSTREAM_REPO")"
          self_tags="$(list_tags "$SELF_REPO")"
          comparison="$(UPSTREAM_TAGS="$upstream_tags" SELF_TAGS="$self_tags" node tests/compare-tags.mjs)"
          upstream_tag="$(jq -r '.upstream' <<<"$comparison")"
          self_tag="$(jq -r '.self' <<<"$comparison")"
          up_newer="$(jq -r '.upNewer' <<<"$comparison")"

          echo "upstream newest: ${upstream_tag:-<none>} / this repo: ${self_tag:-<none>}"

          issues="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | "\(.number)\t\(.title)"')"
          find_issue() { # <title> -> number
            local want="$1" line
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              if [ "${line#*$'\t'}" = "$want" ]; then printf '%s' "${line%%$'\t'*}"; return 0; fi
            done <<<"$issues"
            return 0
          }

          tracker_title="New upstream dsh release available: $upstream_tag"
          health_title="Release pipeline not published: $self_tag"

          if [ "$up_newer" != "true" ]; then
            # 已跟上上游: 该 tag 有 Release 就关 tracker issue。
            closed=0
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              num="${line%%$'\t'*}"; ititle="${line#*$'\t'}"
              case "$ititle" in
                "New upstream dsh release available: "*)
                  tag="${ititle#New upstream dsh release available: }"
                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh issue close "$num" --comment \
                      "Published: \`$tag\` has a GitHub Release (image tags were merged by publish.yml)." \
                      >/dev/null || true
                    closed=$((closed + 1))
                  fi
                  ;;
              esac
            done <<<"$issues"

            # 健康检查: 最新 tag 没有 Release ⇒ 发布没完成。push 触发时跳过(发布
            # 要跑 ~25 分钟, 立即判定会误报), 交给下一次 cron。
            if [ "$EVENT_NAME" != "push" ] && [ -n "$self_tag" ]; then
              health_num="$(find_issue "$health_title")"
              if gh release view "$self_tag" >/dev/null 2>&1; then
                if [ -n "$health_num" ]; then
                  gh issue close "$health_num" --comment \
                    "\`$self_tag\` now has a GitHub Release; the publish pipeline completed." >/dev/null || true
                fi
              else
                run_url="$(gh api "repos/$SELF_REPO/actions/runs?per_page=50" 2>/dev/null \
                  | jq -r --arg tag "$self_tag" \
                      '[.workflow_runs[]? | select(.path == ".github/workflows/publish.yml" and .head_branch == $tag)]
                       | sort_by(.created_at) | last | .html_url // "none"' 2>/dev/null || echo none)"
                if [ -z "$health_num" ]; then
                  gh issue create --title "$health_title" --body "$(printf '%s\n' \
                    "The newest tag is \`$self_tag\`, but it has **no GitHub Release** — the publish pipeline did not finish." \
                    "" \
                    "Latest \`publish.yml\` run: $run_url" \
                    "" \
                    "Diagnose with:" \
                    "" \
                    '    gh run view <run-id> --log-failed' \
                    '    gh run download <run-id> -n smoke-diagnostic-amd64 -D ./diag' \
                    "" \
                    "If the tag was removed by the failure cleanup, re-push it after fixing the cause:" \
                    "" \
                    "    git tag -f $self_tag <fixed-commit> && git push -f origin $self_tag" \
                    "" \
                    "This issue closes automatically once the tag has a Release.")" >/dev/null
                fi
              fi
            fi
            echo "up to date (closed $closed tracker issue(s))"
            exit 0
          fi

          # ---- 上游有新 tag ----
          issue_num="$(find_issue "$tracker_title")"
          if [ -z "$issue_num" ]; then
            body="$(printf '%s\n' \
              "Upstream published [\`$upstream_tag\`](https://github.com/$UPSTREAM_REPO/releases/tag/$upstream_tag), which this repository has not mirrored yet." \
              "" \
              "| | tag |" \
              "|---|---|" \
              "| upstream | \`$upstream_tag\` |" \
              "| this repo | \`${self_tag:-none}\` |" \
              "" \
              "Compare: https://github.com/$UPSTREAM_REPO/compare/${self_tag:-$upstream_tag}...$upstream_tag" \
              "" \
              "Publishing is driven by the tag itself:" \
              "" \
              "    git tag $upstream_tag <commit>" \
              "    git push origin $upstream_tag" \
              "" \
              "The publish workflow then runs the static gates, builds both architectures by digest, smoke-tests them, and merges the multi-arch image + GitHub Release.")"
            if ! created="$(gh issue create --title "$tracker_title" --body "$body" --label upstream-dsh 2>/dev/null)"; then
              created="$(gh issue create --title "$tracker_title" --body "$body")"
            fi
            issue_num="$(printf '%s' "$created" | grep -oE '[0-9]+$' || true)"
            echo "opened tracker issue #$issue_num for $upstream_tag"
          else
            echo "tracker issue #$issue_num already tracks $upstream_tag"
          fi

          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "RELEASE_PAT is not configured; leaving the manual command on issue #$issue_num"
            exit 0
          fi

          # 退避: 24 小时内该 tag 已失败过一次发布 ⇒ 不再自动重推(否则每 6 小时
          # 重跑一次双架构构建)。人工重推不受影响。
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent_failures="$(gh api "repos/$SELF_REPO/actions/runs?per_page=100" 2>/dev/null \
            | jq -r --arg tag "$upstream_tag" --arg since "$since" \
                '[.workflow_runs[]?
                  | select(.path == ".github/workflows/publish.yml" and .head_branch == $tag
                           and .conclusion == "failure" and .created_at > $since)] | length' 2>/dev/null || echo 0)"
          if [ "$recent_failures" != "0" ]; then
            echo "publish failed for $upstream_tag within 24h; not re-tagging (backoff)"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$upstream_tag" >/dev/null 2>&1; then
            echo "tag $upstream_tag already exists here; nothing to do"
            exit 0
          fi

          git fetch --quiet origin main
          main_sha="$(git rev-parse origin/main)"
          git tag "$upstream_tag" "$main_sha"
          # 必须用 PAT 推: GITHUB_TOKEN / App token 的 push 不会触发 workflow。
          # actions/checkout 不会留下 extraheader(persist-credentials: false), 这里
          # 仍显式清空一次, 防止未来默认值变化让"PAT 推送"实际变成 GITHUB_TOKEN。
          if git -c "http.https://github.com/.extraheader=" push \
              "https://x-access-token:${RELEASE_PAT}@github.com/${SELF_REPO}.git" \
              "refs/tags/$upstream_tag"; then
            echo "pushed tag $upstream_tag at $main_sha; publish.yml should start"
          else
            gh issue comment "$issue_num" --body \
              "Failed to push \`$upstream_tag\` with \`RELEASE_PAT\`. Check that the PAT has Contents: read/write and **Workflows: read/write** for this repository." \
              >/dev/null 2>&1 || true
            exit 1
          fi
