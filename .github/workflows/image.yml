name: Image

on:
  push:
    branches: [main]
    tags: ['dsh-v*']
  pull_request:
  workflow_dispatch:

# 所有 dsh-v* tag 构建共用同一个并发组, 串行推送, 避免两个 tag 并发时竞争
# latest; 非 tag 构建仍按 ref 隔离。
concurrency:
  group: image-${{ startsWith(github.ref, 'refs/tags/dsh-v') && 'release' || github.ref }}
  cancel-in-progress: false

# 默认只读; 需要写权限的 job 单独声明
permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax check
        run: bash -n container/*.sh tests/*.sh

      - name: No removed auto-update remnants
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='image.yml' \
               -E 'DSH_AUTO_UPDATE|dsh-update|update-dsh|DSH_VERSION|@deepseek-ai/dsh@' .; then
            echo "found references to removed dsh auto-update / npm install" >&2
            exit 1
          fi
          if grep -nE 'DSH_AUTO_UPDATE[ =:]|dsh-update\.sh|update-dsh[ :]|DSH_VERSION[ =:]' .github/workflows/image.yml; then
            echo "workflow still references removed dsh auto-update / npm install" >&2
            exit 1
          fi

      - name: README parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          en = Path('README.md').read_text()
          zh = Path('README.zh.md').read_text()
          def headings(text):
              return re.findall(r'^#{1,6} .*$', text, re.M)
          def links(text):
              return len(re.findall(r'\[[^\]]*\]\([^)]*\)', text))
          assert len(headings(en)) == len(headings(zh)), 'heading count mismatch'
          assert links(en) == links(zh), 'link count mismatch'
          assert en.count('```') == zh.count('```'), 'code fence count mismatch'
          print('README parity OK')
          PY

      - name: browser-side patch (patch-client.js) is idempotent and warns on drift
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p \
            "$tmp/dsh/packages/client/connection/lib"
          cat > "$tmp/dsh/packages/client/connection/lib/client.js" <<'EOF'
          const handle = {
            api,
            isLoopback: transport?.ownsHost === true || pageLocation === void 0 || isLoopbackHostname(pageLocation.hostname),
          };
          EOF
          node container/plugin/scripts/patch-client.js --dsh-root "$tmp/dsh" >/dev/null
          node container/plugin/scripts/patch-client.js --dsh-root "$tmp/dsh" >/dev/null
          grep -q 'isLoopback: true, // dsh-container remote-proxy patch' \
            "$tmp/dsh/packages/client/connection/lib/client.js"
          if grep -q 'isLoopback: pageLocation === void 0' \
            "$tmp/dsh/packages/client/connection/lib/client.js"; then
            echo "old isLoopback gate still present after patch" >&2
            exit 1
          fi
          if grep -q 'isLoopback: transport?.ownsHost === true' \
            "$tmp/dsh/packages/client/connection/lib/client.js"; then
            echo "old isLoopback gate still present after patch" >&2
            exit 1
          fi
          # Version drift must not fail the supervisor: warn and skip with exit 0.
          cat > "$tmp/dsh/packages/client/connection/lib/client.js" <<'EOF'
          const handle = { api, isLoopback: somethingElse };
          EOF
          node container/plugin/scripts/patch-client.js --dsh-root "$tmp/dsh" >/dev/null 2>&1

      - name: Validate compose example
        run: docker compose -f examples/compose.yaml config --quiet

      - name: Validate quadlet example
        run: |
          sudo mkdir -p /etc/containers/systemd
          sudo cp examples/dsh.container /etc/containers/systemd/
          sudo systemctl daemon-reload
          systemctl cat dsh.service >/dev/null

      # dsh-v* tag 的发布闸门: 手工推 tag(绕过 release-prep 的契约 → triage →
      # agent 环节)时, 这里仍然静态核对上游契约。漂移未处理就不发布镜像 ——
      # 2026-09-22 dsh-v0.1.7-alpha.1 是这样手工发的, 当时没有人替我们把契约
      # 检查跑一遍。非 tag 构建跳过(漂移由每日 watcher + release-prep 负责)。
      - name: Upstream contract check (dsh-v* tags)
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        run: bash tests/contract.sh --tag "${GITHUB_REF_NAME}"

  image:
    name: Build, validate and publish image (linux/amd64)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求仓库名全小写, 而 github.repository 可能含大写(如 NIyueeE)。
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 本仓库 release tag 与官方仓库 tag 完全一致(如 dsh-v0.1.2-alpha.3);
      # DSH_TAG 与 BUILD_VERSION 都直接使用该 tag。非发布构建 label 为 latest。
      - name: Compute build args
        id: args
        env:
          DSH_TAG_REPO: ${{ vars.DSH_TAG || 'latest' }}
        run: |
          dsh_tag="$DSH_TAG_REPO"
          label="latest"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == dsh-v* ]]; then
            dsh_tag="${{ github.ref_name }}"
            label="${{ github.ref_name }}"
          fi
          {
            echo "BUILD_GIT_SHA=${{ github.sha }}"
            echo "BUILD_GIT_REF=${{ github.ref_name }}"
            echo "BUILD_VERSION=$label"
            echo "DSH_TAG=$dsh_tag"
          } > /tmp/build-args.txt
          {
            echo "args<<EOF"
            cat /tmp/build-args.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 验证构建: 仅 linux/amd64, load 到本地供冒烟测试; 不推送。
      - name: Build image (validation)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.args.outputs.args }}

      # 冒烟测试已抽到 tests/smoke.sh(image.yml 与 release-prep.yml 共用,
      # 本地可用 just test 运行); 发布构建额外校验 dsh 版本与 tag 一致。
      - name: Smoke test
        run: |
          args=()
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == dsh-v* ]]; then
            args+=(--expect-dsh-version "${GITHUB_REF_NAME#dsh-v}")
          fi
          tests/smoke.sh "${{ steps.image.outputs.name }}:${{ github.sha }}" ${args+"${args[@]}"}

      # 冒烟通过后才把 amd64 镜像按 digest 推到 GHCR(不打版本 tag):
      # arm64 由原生 runner 并行构建, 最后由 merge job 合并为多架构镜像
      # 并统一打 dsh-v* + <sha> + latest。坏镜像不会拿到任何 tag。
      - name: Push linux/amd64 by digest (release only)
        id: publish
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.args.outputs.args }}

  # arm64 用 GitHub 公开仓库免费提供的原生 Arm runner 构建, 不走 QEMU 模拟
  # (QEMU 下 pnpm 全量构建会慢一个数量级)。与 amd64 并行, 仅发布时构建。
  image-arm64:
    name: Build and publish image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: validate
    if: startsWith(github.ref, 'refs/tags/dsh-v')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 与 amd64 job 相同的镜像名与 build args 计算。
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute build args
        id: args
        env:
          DSH_TAG_REPO: ${{ vars.DSH_TAG || 'latest' }}
        run: |
          dsh_tag="$DSH_TAG_REPO"
          label="latest"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == dsh-v* ]]; then
            dsh_tag="${{ github.ref_name }}"
            label="${{ github.ref_name }}"
          fi
          {
            echo "BUILD_GIT_SHA=${{ github.sha }}"
            echo "BUILD_GIT_REF=${{ github.ref_name }}"
            echo "BUILD_VERSION=$label"
            echo "DSH_TAG=$dsh_tag"
          } > /tmp/build-args.txt
          {
            echo "args<<EOF"
            cat /tmp/build-args.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-arm64
          cache-to: type=gha,mode=max,scope=build-arm64
          build-args: ${{ steps.args.outputs.args }}

  # 两个平台的 digest 都就绪后, 合并为一个多架构镜像并统一打版本 tag。
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [image, image-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and tag multi-arch manifest
        run: |
          set -euo pipefail
          image="${{ needs.image.outputs.name }}"
          docker buildx imagetools create \
            -t "$image:${{ github.sha }}" \
            -t "$image:${{ github.ref_name }}" \
            -t "$image:latest" \
            "$image@${{ needs.image.outputs.digest }}" \
            "$image@${{ needs.image-arm64.outputs.digest }}"

      - name: Inspect multi-arch manifest
        run: docker buildx imagetools inspect "${{ needs.image.outputs.name }}:${{ github.ref_name }}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: merge
    if: startsWith(github.ref, 'refs/tags/dsh-v')
    permissions:
      contents: write
    steps:
      # 镜像构建 + 冒烟通过后才创建 Release 页面;
      # 页面 tag 使用官方仓库 tag(如 dsh-v0.1.2-alpha.3)。
      # 发布说明 = 本镜像自己的升级/适配说明 + 上游同名 tag 的 release notes
      # (折叠引用, 上游是各版本迁移细节的权威); generate_release_notes 追加
      # 本仓库的提交清单。
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ vars.DSH_UPSTREAM_REPO || 'deepseek-ai/deepseek-harness' }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-body.md"
          cat > "$body" <<'EOF'
          > **Upgrading an existing data volume:** a release may migrate data under `~/.dsh`
          > **forward** — session-log format, settings/preset storage, provider configuration. The
          > upstream notes quoted below are the authority on what this version changes. Migration is
          > one-way: **do not roll the image back** to an older `dsh-v*` tag after upgrading a volume.
          >
          > **Upgrading a volume created before the image-owned-toolchain layout:** the image
          > owns the whole toolchain as a system layer (uv/pnpm in `/usr/local/bin`,
          > Rust toolchains in `/opt/rust`, dsh in `/opt/deepseek-harness`); `/home/dsh` holds only
          > data and caches. The one writable exception is rustup's home `/opt/rust/rustup`, which
          > rustup must write at runtime — it is built `dsh`-owned and the entrypoint repairs its
          > ownership on every start. Toolchain copies seeded into older volumes are inert (PATH prefers the
          > image binaries) but waste space — remove them manually inside the container if desired:
          >
          > ```bash
          > rm -rf ~/.local/bin/uv ~/.local/bin/uvx ~/.local/bin/pnpm \
          >        ~/.local/share/pnpm/lib/node_modules/pnpm ~/.local/share/pnpm/bin/pnpm
          > # only if you keep no custom toolchains (~/.rustup is ~1GB):
          > rm -rf ~/.rustup ~/.cargo/bin/cargo ~/.cargo/bin/rustc ~/.cargo/bin/rustdoc \
          >        ~/.cargo/bin/rustup ~/.cargo/bin/rust-gdb ~/.cargo/bin/rust-lldb \
          >        ~/.cargo/bin/rust-lldb-server
          > ```
          >
          > Caches (`~/.cargo/registry`, `~/.local/share/uv`, the pnpm store) and all dsh data stay
          > on the volume unchanged. Logging in no longer needs the token URL: the proxy
          > bootstraps the dsh session automatically, and authentication is Caddy's job — enable
          > `DSH_PROXY_USER`/`DSH_PROXY_PASSWORD` for any non-loopback exposure.
          >
          > **Container adaptation:** this image keeps its hack surface as small as upstream allows —
          > the browser-side `isLoopback` bundle patch, the session-cookie bootstrap plugin (the
          > cookie file is state, reconciled into Caddy on content change), and hiding the
          > headless-hostile settings-document button by wrapping `settingsController.describe`
          > (plus the provider `documentPath` flip on pre-v0.1.7 tags). See
          > `docs/upstream-contract.md` § Simplification triggers; adaptation commits are listed
          > below, and the decision record (Adaptation review) lives in the release-prep tracker
          > issue for this tag or in the § Adaptation review log when the tag skipped that path.
          EOF
          # 上游 release notes: 取不到(无 Release 页/接口失败)就只留链接, 不让发版失败。
          # 注意必须用 if 判断退出码: gh api 失败时会把错误 JSON 打到 stdout,
          # 只看输出是否为空会把报错当说明引用进来。
          if upstream="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${GITHUB_REF_NAME}" --jq .body 2>/dev/null)" \
              && [ -n "$upstream" ]; then
            {
              printf '\n<details>\n<summary>Upstream <code>%s</code> release notes (quoted)</summary>\n\n' "$GITHUB_REF_NAME"
              printf '%s\n' "$upstream"
              printf '\n</details>\n'
            } >> "$body"
          else
            echo "note: no upstream release notes found for ${GITHUB_REF_NAME}; linking only" >&2
          fi
          printf '\n---\n\nUpstream release: https://github.com/%s/releases/tag/%s\n' \
            "$UPSTREAM_REPO" "$GITHUB_REF_NAME" >> "$body"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: true
          make_latest: true
