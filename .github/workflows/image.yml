name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate scripts and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax check
        run: bash -n container/*.sh

      - name: Validate compose example
        run: docker compose -f examples/compose.yaml config --quiet

      - name: Validate quadlet example
        run: |
          sudo mkdir -p /etc/containers/systemd
          sudo cp examples/dsh.container /etc/containers/systemd/
          sudo systemctl daemon-reload
          systemctl cat dsh.service >/dev/null

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求仓库名全小写, 而 github.repository 可能含大写(如 NIyueeE)。
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 版本号对齐(仅指镜像自身的版本): 打 v* tag 时, release 版本 ==
      # 镜像 tag(v1.2.0) == OCI 版本 label(1.2.0); main 上 label 为 latest。
      # 镜像版本与 dsh npm 版本完全解耦: dsh 版本由 DSH_VERSION 决定,
      # 默认构建时 npm latest + 运行时自动更新, 与 tag 无关。
      - name: Compute version metadata
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "label=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "label=latest" >> "$GITHUB_OUTPUT"
          fi

      # 组装 build args: DSH_VERSION 仅当仓库变量(Settings → Variables → DSH_VERSION)
      # 设置了才传, 避免空值覆盖 Containerfile 里的默认值。
      - name: Compute build args
        id: args
        run: |
          {
            echo "BUILD_GIT_SHA=${{ github.sha }}"
            echo "BUILD_GIT_REF=${{ github.ref_name }}"
            echo "BUILD_VERSION=$label"
            [ -z "$dsh" ] || echo "DSH_VERSION=$dsh"
          } > /tmp/build-args.txt
          {
            echo "args<<EOF"
            cat /tmp/build-args.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          label: ${{ steps.version.outputs.label }}
          dsh: ${{ vars.DSH_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          # PR 只构建不推送; main 与 tag 推送。
          # 单平台(universal 基础镜像仅 amd64), load 后本地可直接冒烟。
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.image.outputs.name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.args.outputs.args }}

      # 注: GHCR 新建包默认 private。GitHub 已移除改可见性的 REST API
      # (POST/PATCH /user/packages/container/<name>/visibility 均 404),
      # 首次发布后需在包设置页手动改为 public, 见 docs/releasing.md。
      # 包通过 org.opencontainers.image.source 标签自动链接到本仓库,
      # 访问权限随仓库继承, 只有可见性需手动设置一次。

      - name: Smoke test
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}:${{ github.sha }}"
          # 桥接 + 端口映射, 与默认部署方式一致。
          cid="$(docker run -d --rm --name dsh-smoke -p 3080:3080 \
            -e DSH_HOME=/tmp/dsh-smoke-home \
            -e DSH_AUTO_UPDATE=0 \
            "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          # 等待 Web UI 就绪(首次启动需自动初始化 web profile)
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3080/ 2>/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3080/ | grep -q '<title>DeepSeek Harness</title>'

          # 工具链与 dsh 版本
          docker exec "$cid" dsh --version | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'
          docker exec "$cid" node --version | grep -Eq '^v[0-9]+\.'
          docker exec "$cid" cargo --version | grep -Eq '^cargo [0-9]+\.'
          docker exec "$cid" uv --version | grep -Eq '^uv [0-9]+\.'

          # 自动更新脚本幂等: 已是最新时输出 already up to date;
          # 若恰逢新版本发布也会正常升级并输出 updating/now。
          docker exec "$cid" dsh-update | grep -Eq 'already up to date|updating|^\[dsh-update\] now'

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # 镜像构建 + 冒烟通过后才创建 Release 页面;
      # 版本号与镜像 tag 对齐(均由 git tag 派生, 如 v1.2.0)。
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
