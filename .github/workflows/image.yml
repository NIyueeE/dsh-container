name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一 ref 的并发构建串行化(避免两个 tag 连续推送时竞争 latest)
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

# 默认只读; 需要写权限的 job 单独声明
permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax check
        run: bash -n container/*.sh

      - name: Validate compose example
        run: docker compose -f examples/compose.yaml config --quiet

      - name: Validate quadlet example
        run: |
          sudo mkdir -p /etc/containers/systemd
          sudo cp examples/dsh.container /etc/containers/systemd/
          sudo systemctl daemon-reload
          systemctl cat dsh.service >/dev/null

  image:
    name: Build and validate image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 要求仓库名全小写, 而 github.repository 可能含大写(如 NIyueeE)。
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 版本号对齐(仅指镜像自身的版本): 打 v* tag 时, release 版本 ==
      # 镜像 tag(v1.2.0) == OCI 版本 label(1.2.0); 非发布构建 label 为 latest。
      # 镜像版本与 dsh npm 版本完全解耦: dsh 版本由 DSH_VERSION 决定,
      # 默认构建时 npm latest + 运行时自动更新, 与 tag 无关。
      - name: Compute version metadata
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "label=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "label=latest" >> "$GITHUB_OUTPUT"
          fi

      # 组装 build args: DSH_VERSION 仅当仓库变量(Settings → Variables → DSH_VERSION)
      # 设置了才传, 避免空值覆盖 Containerfile 里的默认值。
      - name: Compute build args
        id: args
        run: |
          {
            echo "BUILD_GIT_SHA=${{ github.sha }}"
            echo "BUILD_GIT_REF=${{ github.ref_name }}"
            echo "BUILD_VERSION=$label"
            [ -z "$dsh" ] || echo "DSH_VERSION=$dsh"
          } > /tmp/build-args.txt
          {
            echo "args<<EOF"
            cat /tmp/build-args.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          label: ${{ steps.version.outputs.label }}
          dsh: ${{ vars.DSH_VERSION }}

      # 只有 v* tag(正式发布)才推送镜像; 其余事件(main / PR / dispatch)
      # 只构建 + 冒烟验证临时镜像, 不产生任何 GHCR 产物。
      # 单平台(universal 基础镜像仅 amd64), load 后本地可直接冒烟。
      - name: Build image (validation)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:latest', steps.image.outputs.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.args.outputs.args }}

      # 注: GHCR 新建包默认 private。GitHub 已移除改可见性的 REST API
      # (POST/PATCH /user/packages/container/<name>/visibility 均 404),
      # 首次发布后需在包设置页手动改为 public, 见 docs/releasing.md。
      # 包通过 org.opencontainers.image.source 标签自动链接到本仓库,
      # 访问权限随仓库继承, 只有可见性需手动设置一次。

      - name: Smoke test
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}:${{ github.sha }}"
          # 桥接 + 端口映射, 与默认部署方式一致(对外端口 3081)。
          cid="$(docker run -d --rm --name dsh-smoke -p 3081:3081 \
            -e DSH_HOME=/tmp/dsh-smoke-home \
            -e DSH_AUTO_UPDATE=0 \
            "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          # 等待 Web UI 就绪(首次启动需自动初始化 web profile)
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3081/ 2>/dev/null; then
              break
            fi
            sleep 2
          done
          # grep 不带 -q: -q 匹配即退出会让管道上游(docker exec/curl)写
          # 入已关闭的管道触发 SIGPIPE(141), 在 set -euo pipefail 下误报失败。
          if ! curl -fsS http://127.0.0.1:3081/ | grep '<title>DeepSeek Harness</title>' >/dev/null; then
            echo "=== dsh-smoke container logs ===" >&2
            docker logs "$cid" >&2 2>&1 || true
            exit 1
          fi

          # 工具链与 dsh 版本
          docker exec "$cid" dsh --version | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'
          docker exec "$cid" node --version | grep -Eq '^v[0-9]+\.'
          docker exec "$cid" cargo --version | grep -Eq '^cargo [0-9]+\.'
          docker exec "$cid" uv --version | grep -Eq '^uv [0-9]+\.'
          # Caddy 代理已在容器内运行(头改写链路)
          docker exec "$cid" sh -c 'pgrep -x caddy >/dev/null'

          # 头改写代理链路: settings.describe 属上游仅回环特权方法, 经代理
          # 改写 Host/Origin 后应返回 200(远程访问全功能的核心保证)。
          settings_code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:3081/api/settings.describe -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"1","method":"settings.describe","payload":{}}')"
          [ "$settings_code" = "200" ]

          # 真实更新链路: 卸载后由 dsh-update 重新安装。验证 uid 1000 的
          # 全局 npm install(含 node-pty 等原生模块的 install scripts)全链路
          # 可用 —— 此前只验证了"已是最新"的空操作路径, 真正的安装从未被 CI 覆盖。
          docker exec "$cid" npm uninstall --global --no-fund --no-audit @deepseek-ai/dsh
          docker exec "$cid" dsh-update | grep -E 'installing|installed|updating|already up to date'
          docker exec "$cid" dsh --version | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'
          # 幂等: 再次运行不再安装
          docker exec "$cid" dsh-update | grep 'already up to date'

          # basic auth 模式: 未带凭据 401, 带凭据 200。
          auth_cid="$(docker run -d --rm --name dsh-smoke-auth -p 127.0.0.1:3082:3081 \
            -e DSH_HOME=/tmp/dsh-smoke-auth-home \
            -e DSH_AUTO_UPDATE=0 \
            -e DSH_PROXY_USER=smoke \
            -e DSH_PROXY_PASSWORD=smoke-pass \
            "$image")"
          trap 'docker rm -f "$cid" "$auth_cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:3082/ 2>/dev/null; then
              break
            fi
            sleep 2
          done
          unauth="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:3082/api/host.describe -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"1","method":"host.describe","payload":{}}')"
          auth="$(curl -s -o /dev/null -w '%{http_code}' -u smoke:smoke-pass -X POST \
            http://127.0.0.1:3082/api/host.describe -H 'content-type: application/json' \
            --data '{"type":"client-request","rpcId":"1","method":"host.describe","payload":{}}')"
          [ "$unauth" = "401" ] && [ "$auth" = "200" ]

      # 冒烟通过后才推送(正式发布): v* 版本 tag + sha + latest(指向最近一次发布,
      # 供示例直接拉取)。坏镜像不会进入 GHCR。
      - name: Push image (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          docker push "$image:${{ github.sha }}"
          docker push "$image:${{ github.ref_name }}"
          docker push "$image:latest"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # 镜像构建 + 冒烟通过后才创建 Release 页面;
      # 版本号与镜像 tag 对齐(均由 git tag 派生, 如 v1.2.0)。
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
