name: tmp secret check

# 一次性诊断: 打印 RELEASE_PAT 的类型指纹(前缀 4 字符 + 长度),
# 不打印值本身 —— 用来确认 Actions 运行时实际拿到的 secret 值是什么
# (ghs_ = GitHub App 安装 token, ghp_ = classic PAT, github_pat_ = fine-grained PAT)。
# 用后即删。

on:
  workflow_dispatch:

permissions: {}

jobs:
  chk:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint RELEASE_PAT
        run: |
          v="${{ secrets.RELEASE_PAT }}"
          if [ -n "$v" ]; then
            echo "len=${#v}"
            echo "first4=${v:0:4}"
            echo "last4=${v: -4}"
          else
            echo "EMPTY (secret not visible to this run)"
          fi