name: Release prep

# 上游 dsh tag 的自动发版准备流水线(与 docs/releasing.md / AGENTS.md 同步维护):
#
#   contract — tests/contract.sh 静态契约检查(docs/upstream-contract.md 的机器形态),
#              数秒判定上游 tag 是否存在兼容漂移; 本仓库已有同名 tag 时幂等跳过
#   prep     — (漂移时)在本仓库上一个发布 tag 的镜像里以 dsh headless 运行修复
#              agent(dsh 数据在独立 HOME, 模型配置由 secrets 生成成装载期
#              --patch 覆盖层 —— 不能写扁平的 settings.yaml, 见 prep 步骤注释,
#              模型走自建中转的 openai-responses 端点): 读上游 diff + 契约文档,
#              最小化修复(通常是 container/plugin/ 的传输层注入或构建期
#              后处理锚点); 每次发布(含无漂移)都对照契约文档
#              § Simplification triggers 审视上游新能力, 能干掉 hack 就删掉
#              (适配层随上游演进保持最小); 结果推 release-prep/<tag> 分支,
#              报告(含 Adaptation review 段)贴到 tracker issue —— 该报告即
#              本 tag 适配层决策记录, 改动本身随 release commits 进入 release note
#   verify   — 用修复后的树以 DSH_TAG=<新 tag> 构建镜像并跑 tests/smoke.sh
#              (闸门不信任 agent 自验)
#   release  — verify 通过后把修复分支快进到 main, 用 RELEASE_PAT(fine-grained
#              PAT, 必须带 "Workflows: read and write" 仓库权限)推 dsh-v* tag,
#              随后轮询 Actions API 确认 image.yml 已被该 push 触发 —— 未触发则
#              job 失败、issue 保持打开(2026-09-08 dsh-v0.1.3-alpha.2 事故:
#              tag 推上去了但 image.yml 从未被触发, issue 却被直接关闭);
#              → image.yml 完成构建/冒烟/发布/Release; 未配置 PAT 时降级为在
#              tracker issue 留手动发版命令
#   notify   — 任一环节失败时在 tracker issue 留诊断说明
#
# 触发: upstream-tag.yml 发现新上游 tag 后 repository_dispatch(事件
# upstream-dsh-tag, 携带 new_tag/old_tag/issue), 或手动 dispatch 填 new_tag。
# 配置: secrets TERNARYBIT_API_KEY / TERNARYBIT_URL / AGENT_MODEL(agent 模型后端,
#       自建中转, openai-responses 协议),
#       可选 secret RELEASE_PAT(fine-grained, 需勾选 "Workflows: read and write"
#       仓库权限, 否则 push 的 tag 不产生 push event, 不会触发下游)。

on:
  repository_dispatch:
    types: [upstream-dsh-tag]
  workflow_dispatch:
    inputs:
      new_tag:
        description: 'Upstream dsh-v* tag to prep and release (e.g. dsh-v0.2.1-rc.2)'
        required: true
        type: string
      dry_run:
        description: 'Run contract/prep/verify but do not push the tag or publish'
        required: false
        default: false
        type: boolean

# 默认只读; 需要写权限的 job 各自声明(最小权限: 不要在工作流级给 issues 写)
permissions:
  contents: read

concurrency:
  group: release-prep
  cancel-in-progress: false

# 容器 job(自己的镜像)的默认 run shell 是 sh(dash), 不支持 pipefail;
# 全 workflow 显式用 bash(host runner 上的 job 本来也是 bash, 行为不变)。
defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: ${{ vars.DSH_UPSTREAM_REPO || 'deepseek-ai/deepseek-harness' }}
  IMAGE_NAME: ghcr.io/niyueee/dsh-container

jobs:
  contract:
    name: Contract check against upstream tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # fail-fast / triage 决策要贴 tracker issue
    outputs:
      new_tag: ${{ steps.resolve.outputs.new_tag }}
      old_tag: ${{ steps.resolve.outputs.old_tag }}
      issue: ${{ steps.resolve.outputs.issue }}
      verdict: ${{ steps.contract.outputs.verdict }}
      ancestor: ${{ steps.triage.outputs.ancestor }}
      fatal: ${{ steps.triage.outputs.fatal }}
      agent_required: ${{ steps.triage.outputs.agent_required }}
      surface_hits: ${{ steps.triage.outputs.surface_hits }}
      dry_run: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve tags and tracker issue
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # 这些值来自事件 payload / 手动输入, 是不可信文本: 只进 env, 绝不能
          # 用 ${{ }} 直接拼进 run 脚本(否则 `` `...` `` / $(...) 会在 runner 上执行)。
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_NEW_TAG: ${{ github.event.client_payload.new_tag }}
          PAYLOAD_OLD_TAG: ${{ github.event.client_payload.old_tag }}
          PAYLOAD_ISSUE: ${{ github.event.client_payload.issue }}
          INPUT_NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            new_tag="$PAYLOAD_NEW_TAG"
            old_tag="$PAYLOAD_OLD_TAG"
            issue="$PAYLOAD_ISSUE"
          else
            new_tag="$INPUT_NEW_TAG"
            old_tag=""
            issue=""
          fi
          # tag 形状校验(与 tests/contract.sh、upstream-tag.yml 保持一致)
          [[ "$new_tag" =~ ^dsh-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "invalid new_tag: $new_tag" >&2; exit 1; }
          # 幂等: 本仓库已有同名 tag(已发版或重复 dispatch)→ 跳过。
          # ls-remote 退出码语义: 0 = 匹配到(存在), 2 = 无匹配(不存在),
          # 其他非零 = 传输错误 —— 必须重试后再放弃, 否则网络抖动会被误判成
          # "tag 不存在", 白白重跑 verify(甚至重复发版)。
          tag_exists=0
          lookup_ok=0
          for _ in 1 2 3; do
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$new_tag" >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 0 ]; then
              tag_exists=1
              lookup_ok=1
              break
            fi
            if [ "$rc" = 2 ]; then
              lookup_ok=1
              break
            fi
            echo "ls-remote transport error (rc=$rc); retrying..." >&2
            sleep 5
          done
          # 重试耗尽仍无法判断时必须失败, 不能把网络错误当成"tag 不存在"
          # 继续跑完整 prep/verify, 最后才在 tag push 处失败。
          if [ "$lookup_ok" != 1 ]; then
            echo "cannot determine whether $new_tag exists (git ls-remote failed); refusing to continue" >&2
            exit 1
          fi
          verdict="ready"
          if [ "$tag_exists" = 1 ]; then
            echo "tag $new_tag already exists in this repository; nothing to do"
            verdict="skipped"
          fi
          # old_tag 兜底: dispatch 未携带时取本仓库最新 dsh-v* tag。sort -V 把
          # 同一核心的预发布版排在稳定版之后, 与 semver 相反; 若最高项是预发布
          # 且同核心稳定版存在, 改选稳定版(只用于圈定 compare 范围)。
          if [ -z "$old_tag" ]; then
            old_tag="$(git ls-remote --tags origin 'refs/tags/dsh-v*' \
              | sed -E 's#.*refs/tags/(dsh-v[0-9.]+.*)$#\1#' | grep -v '\^{}' \
              | sort -V | tail -n1 || true)"
            case "$old_tag" in
              *-*)
                stable="${old_tag%-*}"
                if git ls-remote --exit-code --tags origin "refs/tags/$stable" >/dev/null 2>&1; then
                  old_tag="$stable"
                fi
                ;;
            esac
          fi
          # issue 兜底: 找标题匹配的未关闭 tracker issue
          if [ -z "$issue" ]; then
            issue="$(gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"New upstream dsh release available: $new_tag\") | .number" \
              | head -n1 || true)"
          fi
          {
            echo "new_tag=$new_tag"
            echo "old_tag=$old_tag"
            echo "issue=$issue"
            echo "verdict=$verdict"
          } >> "$GITHUB_OUTPUT"

      - name: Contract check
        id: contract
        env:
          RESOLVE_VERDICT: ${{ steps.resolve.outputs.verdict }}
          NEW_TAG: ${{ steps.resolve.outputs.new_tag }}
        run: |
          set -euo pipefail
          # skip 逻辑放本步内部而非 step if: 被跳过的 step 不产出 output,
          # job output verdict 会变成空串, 下游的 != 'skipped' 判断就会误放行
          # (首轮演练踩过的坑)。
          if [ "$RESOLVE_VERDICT" = "skipped" ]; then
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 注意不能 -e 吞掉退出码 2(2 = 漂移, 是预期结果之一)
          set +e
          bash tests/contract.sh --tag "$NEW_TAG" \
            --repo "$UPSTREAM_REPO" 2>&1 | tee /tmp/contract-report.txt
          rc="${PIPESTATUS[0]}"
          set -e
          case "$rc" in
            0) verdict="clean" ;;
            2) verdict="drift" ;;
            *) echo "contract.sh infrastructure error (rc=$rc)" >&2; exit 1 ;;
          esac
          sed -n 'p' /tmp/contract-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Collect upstream diff (complete file list)
        if: steps.contract.outputs.verdict != 'skipped'
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.resolve.outputs.new_tag }}
          OLD_TAG: ${{ steps.resolve.outputs.old_tag }}
        run: |
          set -euo pipefail
          # 完整文件清单用 git 拿: compare API 有 300 文件上限且按路径排序
          # 截断, 会漏掉适配面(packages/ 恰好在截断区, 实测过)。git 失败
          # 才退回 compare payload —— 分诊脚本会识别截断并保守放行 agent。
          files_source="compare"
          if [ -n "$OLD_TAG" ] \
              && git clone --quiet --depth 1 --branch "$NEW_TAG" \
                   "https://github.com/$UPSTREAM_REPO.git" /tmp/triage-upstream 2>/dev/null \
              && git -C /tmp/triage-upstream fetch --quiet --depth 1 origin tag "$OLD_TAG" 2>/dev/null; then
            git -C /tmp/triage-upstream diff --name-only "$OLD_TAG" "$NEW_TAG" \
              > /tmp/triage-files.txt
            files_source="git"
          fi
          # 祖先信号(误派发检测)与兜底清单: compare payload
          if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$UPSTREAM_REPO/compare/${OLD_TAG}...${NEW_TAG}" \
                > /tmp/upstream-diff.json 2>/dev/null; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$UPSTREAM_REPO/commits/$NEW_TAG" \
              > /tmp/upstream-diff.json
          fi
          # 分诊步骤自行按文件存在性选择清单来源, 这里只记录来源供日志参考
          echo "files_source=$files_source"
          echo "status=$(jq -r '.status // empty' /tmp/upstream-diff.json 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Diff triage (code-level agent admission gate)
        if: steps.contract.outputs.verdict != 'skipped'
        id: triage
        env:
          CONTRACT_VERDICT: ${{ steps.contract.outputs.verdict }}
          DIFF_STATUS: ${{ steps.diff.outputs.status }}
        run: |
          set -euo pipefail
          # 从契约报告解析 MISS 的 check-id(DRIFT: id1 id2 ... 行)
          missed="$(sed -n 's/^DRIFT: //p' /tmp/contract-report.txt \
            | tr ' ' '\n' | grep -v '^$' | paste -sd' ' - || true)"
          args=(--verdict "$CONTRACT_VERDICT" \
            --missed "$missed" --status "$DIFF_STATUS")
          if [ -f /tmp/triage-files.txt ]; then
            tests/triage-diff.sh --files /tmp/triage-files.txt "${args[@]}" > /tmp/triage.txt
          elif [ -f /tmp/upstream-diff.json ]; then
            tests/triage-diff.sh --diff /tmp/upstream-diff.json "${args[@]}" > /tmp/triage.txt
          else
            # 无任何 diff 数据: 无法证明安全, 保守放行 agent
            printf 'TRIAGE ancestor=no\nTRIAGE fatal=no\nTRIAGE surface_hits=unknown(no-diff-data)\nTRIAGE agent_required=yes\n' \
              > /tmp/triage.txt
          fi
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/triage.txt
          while IFS='=' read -r k v; do
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < <(sed 's/^TRIAGE //' /tmp/triage.txt)

      - name: Fail fast on fence drift or mis-dispatched tag
        if: >-
          ${{
            steps.contract.outputs.verdict != 'skipped' &&
            (steps.triage.outputs.fatal == 'yes' || steps.triage.outputs.ancestor == 'yes')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.resolve.outputs.issue }}
          NEW_TAG: ${{ steps.resolve.outputs.new_tag }}
          TRIAGE_FATAL: ${{ steps.triage.outputs.fatal }}
        run: |
          set -euo pipefail
          if [ "$TRIAGE_FATAL" = "yes" ]; then
            msg="## Release prep stopped: security-fence contract drift in \`$NEW_TAG\`

            \`tests/contract.sh\` reports \`server.request_fence\` missing — the /api header trust fence this image's proxy relies on is gone or redesigned upstream. Per policy this is reported, never worked around: the agent was NOT admitted and no release was attempted."
          else
            msg="## Release prep stopped: \`$NEW_TAG\` is not newer than the last released tag (mis-dispatch)

            The upstream compare reports this tag as *behind*; nothing was built or released."
          fi
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$msg" || true
          fi
          printf '%s\n' "$msg" >&2
          exit 1

      - name: Note code-level triage decision
        if: >-
          ${{
            steps.contract.outputs.verdict != 'skipped' &&
            steps.triage.outputs.agent_required == 'no' &&
            steps.triage.outputs.fatal == 'no' &&
            steps.triage.outputs.ancestor == 'no' &&
            steps.resolve.outputs.issue != ''
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.resolve.outputs.issue }}
          NEW_TAG: ${{ steps.resolve.outputs.new_tag }}
          HITS: ${{ steps.triage.outputs.surface_hits }}
          VERDICT: ${{ steps.contract.outputs.verdict }}
        run: |
          # HITS 来自上游 git diff 的文件路径(不受信数据, DSH_UPSTREAM_REPO
          # 可被变量覆盖): 先做字符白名单清洗, 防止反引号/]( 等跳出行内
          # 代码注入 markdown/HTML 到公开 issue。
          hits_safe="$(printf '%s' "$HITS" | sed 's/[^A-Za-z0-9_./,-]/_/g')"
          gh issue comment "$ISSUE" --body \
            "## Diff triage (code-level) — agent not admitted for \`$NEW_TAG\`

            Contract verdict: \`$VERDICT\`; the upstream diff does not touch the adaptation surface (hits: \`${hits_safe}\`). No agent review needed; verify runs on the default branch." || true

  prep:
    name: Agent drift repair + adaptation review (dsh)
    needs: contract
    # 入场条件(代码级分诊, tests/triage-diff.sh): 契约漂移(非围栏类)或 diff
    # 命中适配面才唤醒 agent; 围栏漂移/误派发已在 contract job 快速失败。
    # 仅当本仓库已有该 tag(幂等跳过)时不跑。
    if: >-
      ${{
        needs.contract.outputs.verdict != 'skipped' &&
        needs.contract.outputs.agent_required == 'yes' &&
        needs.contract.outputs.fatal != 'yes' &&
        needs.contract.outputs.ancestor != 'yes'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # agent 跑在这里: 只给读权限, 写操作(patch 应用/提交/推送)全部移到
      # 下游的 commit job。这样即使 agent 读到 job token 也没有写能力。
      contents: read
      issues: write # 报告贴到 tracker issue
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      branch: ${{ steps.package.outputs.branch }}
      changed: ${{ steps.package.outputs.changed }}
    container:
      # 用本仓库上一个发布 tag 的镜像当 agent 运行时: 自带 dsh CLI 与全套
      # 工具链, 镜像不可变(不再依赖 codex-universal:latest 的可变漂移)。
      # old_tag 由 contract job 解析, 首次发版为空时兜底 latest。
      # 镜像入口会启动 dsh web, CI 里必须绕过(--entrypoint ""); --user root
      # 规避 Actions workspace 属主与 git dubious-ownership 问题。
      image: ghcr.io/niyueee/dsh-container:${{ needs.contract.outputs.old_tag || 'latest' }}
      options: --entrypoint "" --user root
    env:
      # dsh 数据(settings/sessions)落在 Actions 容器 job 的 HOME(/github/home),
      # 不落 workspace; git 全局 safe.directory 由 Write dsh agent config 步骤注入。
      GIT_CONFIG_GLOBAL: /tmp/dsh-ci-gitconfig
      TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
      TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
      AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
      # 代码级分诊结果: 适配面命中的上游路径(agent 的聚焦范围)
      SURFACE_HITS: ${{ needs.contract.outputs.surface_hits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 关键: 默认 true 会把 job token 写进 /__w/_temp/git-credentials-*.config
          # 并在 .git/config 留 includeIf 指过去; agent 以 root 运行、对 / 可读,
          # 只 unset http.extraheader 删不掉这条 includeIf。agent 期间不需要
          # 任何 git 凭据(后续 clone/fetch 都是公开仓库), 直接不落盘。
          persist-credentials: false

      - name: Collect drift context
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          OLD_TAG: ${{ needs.contract.outputs.old_tag }}
        run: |
          set -euo pipefail
          # 镜像自带 gh, 但这里 curl 直调 REST API 即可(公开仓库, token 提额)
          if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$UPSTREAM_REPO/compare/${OLD_TAG}...${NEW_TAG}" \
                > /tmp/upstream-diff.json 2>/dev/null; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$UPSTREAM_REPO/commits/$NEW_TAG" \
              > /tmp/upstream-diff.json
          fi
          # 上游源码 checkout, 让 agent 完全离线分析(无网络需求)
          git clone --quiet --depth 1 --branch "$NEW_TAG" \
            "https://github.com/$UPSTREAM_REPO.git" /tmp/upstream
          # compare API 的 files 最多 300 条且按路径排序截断(.agents/ 在前,
          # apps/ 与 packages/ 被切掉): agent 只读 JSON 会得出"上游只改了笔记"
          # 的错误结论(2026-10-28 dsh-v0.2.2-alpha.2 的 HOLD 报告就是这么错的)。
          # 用同一份 checkout 补出完整清单, 让 agent 的审查有权威输入。
          files_source="git"
          if [ -n "$OLD_TAG" ] \
              && git -C /tmp/upstream fetch --quiet --depth 1 origin tag "$OLD_TAG" 2>/dev/null; then
            git -C /tmp/upstream diff --name-only "$OLD_TAG" "$NEW_TAG" > /tmp/upstream-files.txt
          else
            # 拿不到旧 tag: 退回截断 payload, 但把来源标出来, prompt 会要求 agent
            # 不要据此断言"没有适配面变更"。
            files_source="compare-truncated"
            jq -r '.files[]?.filename' /tmp/upstream-diff.json \
              > /tmp/upstream-files.txt 2>/dev/null || : > /tmp/upstream-files.txt
            echo "warning: could not compute the full changed-file list; using the truncated compare payload" >&2
          fi
          echo "UPSTREAM_FILES=/tmp/upstream-files.txt" >> "$GITHUB_ENV"
          echo "UPSTREAM_FILES_SOURCE=$files_source" >> "$GITHUB_ENV"
          echo "changed files: $(wc -l < /tmp/upstream-files.txt) (source=$files_source)"
          # 祖先信号: compare status=behind 表示 NEW_TAG 落后于已有发布
          # (误派发旧版本)。triage 门已把误派发挡在 agent 入场之前, 这里
          # 仍导出与 prompt 一致的大写名, 作为 agent 的早退指引。
          status="$(jq -r '.status // empty' /tmp/upstream-diff.json 2>/dev/null || true)"
          ancestor="$([ "$status" = behind ] && echo yes || echo no)"
          echo "IS_ANCESTOR=$ancestor" >> "$GITHUB_ENV"
          echo "context ready: /tmp/upstream-diff.json, /tmp/upstream (is_ancestor=$ancestor)"

      - name: Write dsh agent config (load-time --patch overlay)
        env:
          TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
          TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
        run: |
          set -euo pipefail
          # 模型配置写成 launcher 的装载期覆盖层(下一步 `dsh --patch`), 不写
          # $HOME/.dsh/settings.yaml: 上游 dsh v0.1.7 起设置文档改存
          # $DSH_HOME/profiles/<profile>/cordis.patch.yml, 扁平的 settings.yaml
          # 只剩"一次性 legacy 导入", 且该导入在 Loader 装载完成之后才异步执行
          # (packages/settings/settings/src/index.ts importLegacyDocument)——
          # 对当次启动的模型解析来说已经太晚: agent 回落到 bundle 里的默认
          # agent-default-model(provider deepseek-official), 因容器内没有
          # DEEPSEEK_API_KEY 而以 MISSING_CREDENTIAL 退出。Actions 的 HOME 每次
          # 都是全新的, 所以这条路径 100% 失败且只在 agent 步骤暴露(静态契约
          # 检查与 triage 都拦不到)。覆盖层在装载期生效: 首次启动即有效, 也不
          # 依赖上游设置文档的存放位置(2026-09-22 dsh-v0.1.7-alpha.2 事故)。
          # 覆盖层按 entry id 覆盖 base bundle 的既有条目(agent-default-model /
          # permission / llm-pi-ai), 与镜像自己挂 container/plugin/overlay.yml
          # 是同一机制。baseURL 是密钥值 —— 与旧 settings.yaml 同等暴露面, 不新增。
          cat > /tmp/dsh-agent.patch.yml <<EOF
          - id: agent-default-model
            config:
              provider: ternarybit
              model: "${AGENT_MODEL}"
          - id: permission
            config:
              defaultPreset: workspace-write
          - id: llm-pi-ai
            config:
              providers:
                ternarybit:
                  displayName: TernaryBit
                  apiKeyEnv: TERNARYBIT_API_KEY
                  api: openai-responses
                  baseURL: "${TERNARYBIT_URL}"
                  models:
                    - id: "${AGENT_MODEL}"
                      name: "${AGENT_MODEL}"
                      contextWindow: 1000000
                      maxTokens: 384000
                      input:
                        - text
                        - image
                      reasoningEfforts:
                        off: null
                        low: low
                        high: high
                        max: max
          EOF
          # workspace 属主是 runner uid, 容器内以 root 跑 —— git 会报
          # dubious ownership; 全局 safe.directory 注入(与 commit 步骤同法)
          printf '[safe]\n\tdirectory = %s\n' "$GITHUB_WORKSPACE" > "$GIT_CONFIG_GLOBAL"
          # checkout 已用 persist-credentials: false, 正常不会有 token; 这里再做
          # 一次纵深清理(旧行为/未来默认值变化时兜底): actions/checkout 会把
          # token 写进 /__w/_temp/git-credentials-*.config 并在 .git/config 留
          # includeIf 指向它 —— 只 unset extraheader 删不掉 includeIf, agent 以
          # root 运行、对 / 可读, 必须把两者都清掉。
          git config --unset-all 'http.https://github.com/.extraheader' || true
          while read -r key; do
            if [ -n "$key" ]; then
              git config --local --unset-all "$key" || true
            fi
          done < <(git config --local --get-regexp '^includeif\.' 2>/dev/null | awk '{print $1}' || true)
          rm -f /__w/_temp/git-credentials-*.config 2>/dev/null || true

      - name: Record workspace base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run dsh agent (drift repair + adaptation review)
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          OLD_TAG: ${{ needs.contract.outputs.old_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # stdout = 最终回复(即 agent 报告); stderr = 推理过程(留作排障,
          # 见下方 artifact)。dsh 数据在独立 HOME($HOME/.dsh), 不污染 workspace。
          # launcher 自身的 flag(--patch)必须排在 --profile 之前。
          dsh --patch /tmp/dsh-agent.patch.yml --profile headless "$(cat prompts/release-prep.md)" \
            > /tmp/agent-report.md 2> /tmp/agent-reasoning.log
          [ -s /tmp/agent-report.md ] \
            || { echo "(agent produced no final message; see reasoning log)" > /tmp/agent-report.md; }

      - name: Redact secrets from agent reasoning log
        if: always()
        env:
          TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
          TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
        run: |
          set -euo pipefail
          [ -f /tmp/agent-reasoning.log ] || exit 0
          for v in "$TERNARYBIT_API_KEY" "$TERNARYBIT_URL"; do
            [ -n "$v" ] || continue
            esc="$(printf '%s' "$v" | sed 's/[^[:alnum:]]/\\&/g')"
            sed -i "s/$esc/[REDACTED]/g" /tmp/agent-reasoning.log || true
          done

      - name: Upload agent reasoning log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-reasoning
          path: /tmp/agent-reasoning.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Package agent changes
        id: package
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # 与旧实现一致: agent 若自己 commit 过, mixed reset 回 base, 改动仍在
          # working tree, 不会因为 diff 为空而静默丢失。
          [ -n "$BASE_SHA" ] || { echo "missing base commit sha" >&2; exit 1; }
          git reset --quiet "$BASE_SHA"
          # agent 的 .git 不可信: hooks / core.fsmonitor / filter.*.clean 都能在
          # 后续 git 命令里执行代码(旧实现直接在 agent 的 .git 里 commit, 而
          # commit 步骤的 env 带 GH_TOKEN)。这里只产出一个二进制 patch, 由不带
          # agent 的 commit job 在干净 checkout 上应用、校验、提交。
          git add -A -N
          changed=false
          if ! git diff --quiet; then changed=true; fi
          mkdir -p /tmp/agent-result
          git diff --binary > /tmp/agent-result/agent.patch
          git diff --stat > /tmp/agent-result/agent-stat.txt || true
          branch=""
          if [ "$changed" = true ]; then branch="release-prep/${NEW_TAG}"; fi
          {
            echo "changed=$changed"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "agent changes: changed=$changed branch=${branch:-<none>}"

      - name: Upload agent changes
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-result
          path: /tmp/agent-result
          retention-days: 7

      - name: Report to tracker issue
        if: needs.contract.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          BRANCH: ${{ steps.package.outputs.branch }}
          TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
          TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
        run: |
          set -euo pipefail
          {
            echo "## Agent drift review — \`$NEW_TAG\`"
            echo
            cat /tmp/agent-report.md
            echo
            if [ -n "$BRANCH" ]; then
              echo "Repair branch: \`$BRANCH\` — the verify job will run the static gates, contract check, build and smoke-test it before any release."
            else
              echo "The agent judged no repository changes necessary; the verify job will run on the default branch."
            fi
          } > /tmp/issue-comment.md
          # 密钥防泄漏: 报告由 LLM 生成并会发到公开仓库的 issue 上。发布前
          # 先把本 job 已知的密钥值与常见 token 形态脱敏; 命中即告警。
          # (GITHUB_TOKEN 与 RELEASE_PAT 不在本 job 的 env 里, agent 接触不到。)
          leak=0
          for v in "$TERNARYBIT_API_KEY" "$TERNARYBIT_URL"; do
            [ -n "$v" ] || continue
            if grep -qF -- "$v" /tmp/issue-comment.md; then
              esc="$(printf '%s' "$v" | sed 's/[^[:alnum:]]/\\&/g')"
              sed -i "s/$esc/[REDACTED]/g" /tmp/issue-comment.md
              leak=1
            fi
          done
          if grep -qE 'github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{16,}' \
              /tmp/issue-comment.md; then
            sed -i -E 's/(github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{16,})/[REDACTED-TOKEN]/g' \
              /tmp/issue-comment.md
            leak=1
          fi
          if [ "$leak" = 1 ]; then
            echo "warning: secret-like patterns were redacted from the agent report" >&2
          fi
          # 镜像自带 gh: 直接发评论(body-file 原样 markdown, 无需转义)。
          # 报告是锦上添花 —— 修复分支已推送, 此步失败不应让一次成功的
          # prep 整体失败, 故容错降级。
          if command -v gh >/dev/null 2>&1; then
            gh issue comment "$ISSUE" --body-file /tmp/issue-comment.md \
              || echo "warning: failed to post the agent report to issue #$ISSUE" >&2
          else
            echo "warning: gh unavailable; agent report not posted to issue #$ISSUE" >&2
          fi

  commit:
    name: Apply and push the agent patch (trusted)
    needs: [contract, prep]
    if: needs.prep.result == 'success' && needs.prep.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # 推 release-prep/<tag> 修复分支
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prep.outputs.base_sha }}
          persist-credentials: false

      - name: Download the agent patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: agent-result
          path: /tmp/agent-result

      - name: Apply, validate and push
        id: commit
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          GH_TOKEN: ${{ github.token }}
          TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
          TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
        run: |
          set -euo pipefail
          GIT_CONFIG_GLOBAL="$(mktemp)"
          export GIT_CONFIG_GLOBAL
          printf '[safe]\n\tdirectory = %s\n' "$GITHUB_WORKSPACE" > "$GIT_CONFIG_GLOBAL"
          cd "$GITHUB_WORKSPACE"
          # 干净 checkout 上应用 agent 产出的 patch —— 这个 job 里没有 agent
          # 进程, .git 也从未被 agent 碰过(hooks/fsmonitor/filter 都是干净的)。
          [ -s /tmp/agent-result/agent.patch ] \
            || { echo "agent.patch missing or empty" >&2; exit 1; }
          git apply --index --whitespace=nowarn /tmp/agent-result/agent.patch
          # 安全白名单: 只允许适配面与文档。tests/、prompts/、.github/ 与
          # container/dsh-version-floor.sh 是"判 agent 的闸门", agent 不得改动
          # —— 否则它可以跨版本逐步削弱门禁, 而 release 会把改动带进 main。
          changed_files="$(git -c status.renames=false status --porcelain -z \
            | tr '\0' '\n' | sed -E 's/^.. //')"
          bad="$(printf '%s\n' "$changed_files" \
            | grep -vE '^(container/|docs/|Containerfile$|AGENTS\.md$|README\.md$|README\.zh\.md$)' || true)"
          gate="$(printf '%s\n' "$changed_files" \
            | grep -E '^container/dsh-version-floor\.sh$' || true)"
          if [ -n "$bad" ] || [ -n "$gate" ]; then
            echo "agent modified files outside the allowlist (or a gate file):" >&2
            printf '%s\n%s\n' "$bad" "$gate" >&2
            exit 1
          fi
          branch="release-prep/${NEW_TAG}"
          git checkout -b "$branch"
          git add -A
          # 密钥防泄漏(纵深): agent 的 env 里有模型 key/URL, 它可以把值写进
          # 白名单内的任何文件; 提交前扫 staged 内容, 命中即 abort。
          leak=0
          for v in "$TERNARYBIT_API_KEY" "$TERNARYBIT_URL"; do
            [ -n "$v" ] || continue
            if git grep --cached -q -F -- "$v"; then
              echo "refusing to commit: a known secret appears in the staged files:" >&2
              git grep --cached -l -F -- "$v" >&2 || true
              leak=1
            fi
          done
          # 先把 diff 落盘再 grep: 管道 + pipefail 下 grep -q 提前退出会让
          # git diff 收到 SIGPIPE(141), 命中反而被当成失败漏掉。
          git diff --cached --no-color > /tmp/staged-repair.diff
          if grep -qE 'github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{16,}' /tmp/staged-repair.diff; then
            echo "refusing to commit: the staged diff contains a token-like string" >&2
            leak=1
          fi
          [ "$leak" = 0 ] || exit 1
          git -c user.name="dsh-container release agent" \
              -c user.email="actions@github.com" \
              commit -m "fix: adapt to upstream $NEW_TAG (agent-prepared)"
          git remote add push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" 2>/dev/null \
            || git remote set-url push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force push "HEAD:$branch"
          {
            echo "changed=true"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Static gates + build + smoke (pre-release gate)
    needs: [contract, prep, commit]
    # prep 失败时不跑(等修复重试); prep 被跳过(契约干净)或成功时都跑。
    # !cancelled() 保证 prep 失败时本 job 显式 skipped 而不是被 needs 连坐。
    if: >-
      ${{
        !cancelled() &&
        needs.contract.result == 'success' &&
        needs.contract.outputs.verdict != 'skipped' &&
        (needs.prep.result == 'success' || needs.prep.result == 'skipped') &&
        (needs.commit.result == 'success' || needs.commit.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      # 下游 release 必须把 tag 打在这个 commit 上, 而不是重新 checkout 当前分支
      # (main 在 16 分钟的 verify 期间可能已经前进)。
      sha: ${{ steps.verify-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 有修复分支时验证修复后的树; 干净路径验证默认分支
          ref: ${{ needs.commit.outputs.branch || github.ref }}
          persist-credentials: false

      - name: Record verified commit
        id: verify-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 与 image.yml 的 validate job 完全同一套静态门禁; 不再让 tag 推上去之后
      # 才发现文档/插件/语法问题。
      - name: Static validation (publish-gate parity)
        run: tests/validate-static.sh

      - name: Lint GitHub Actions workflows (publish-gate parity)
        run: tests/validate-workflows.sh

      # 契约门禁在 agent 之后复跑一遍: 如果漂移没被修复(agent 按策略 HOLD),
      # 这里直接失败, 不推一个 image.yml 注定拒绝的 tag。
      - name: Re-run upstream contract on the prepared tree
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: bash tests/contract.sh --tag "$NEW_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 与 image.yml 的发布构建同一 Containerfile / DSH_TAG 语义:
      # 镜像从上游 <new_tag> 源码构建, 这里只验证不推送。
      - name: Build image from new upstream tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:prep-${{ github.run_id }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=min,scope=amd64,ignore-error=true
          build-args: |
            BUILD_GIT_SHA=${{ steps.verify-sha.outputs.sha }}
            BUILD_GIT_REF=${{ needs.commit.outputs.branch || github.ref_name }}
            BUILD_VERSION=latest
            DSH_TAG=${{ needs.contract.outputs.new_tag }}

      - name: Fetch main's smoke gate
        # agent 可写 tests/(更新协议要求它同步契约与冒烟), 但门禁必须用
        # main 上的副本执行 —— 否则被注入的 agent 削弱 smoke.sh 后, verify
        # 会拿削弱的门禁自证通过。干净路径(无 agent)下与工作树内容相同。
        run: |
          set -euo pipefail
          git fetch --depth 1 origin main
          git show origin/main:tests/smoke.sh > /tmp/smoke-main.sh
          chmod +x /tmp/smoke-main.sh

      - name: Smoke test
        run: |
          /tmp/smoke-main.sh "${IMAGE_NAME}:prep-${{ github.run_id }}" \
            --expect-dsh-version "${NEW_TAG#dsh-v}"
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}

      - name: Dry-run summary
        if: needs.contract.outputs.dry_run == 'true'
        run: |
          echo "dry run: contract/prep/verify passed; the tag was NOT pushed and nothing was published" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish tag (or fall back to manual)
    needs: [contract, prep, commit, verify]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        needs.contract.outputs.verdict != 'skipped' &&
        needs.contract.outputs.dry_run != 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # 快进 main 与(降级路径)文档提示
      issues: write
      actions: read   # 推 tag 后轮询确认 image.yml 是否真的被触发
    env:
      # secrets 不能直接用于 if, 借 env 间接判断是否配置了发版 PAT
      HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
    steps:
      # 固定到 verify 实际构建/冒烟的 commit。无 agent 时 main 可能在 verify
      # 期间前进; 不能给未验证的 HEAD 打 tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # 降级保护: 新 tag 必须比本仓库现有最新 dsh-v* tag 更新(semver 语义, 与
      # upstream-tag.yml 的排序键一致)才允许发版 —— 防止误 dispatch 旧 tag 把
      # latest 拖回旧版本。拒绝时不碰 main、不推 tag, 只在 tracker issue 留言。
      - name: 'Guard: refuse downgrade releases'
        id: guard
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags origin 'refs/tags/dsh-v*' \
            | sed -E 's#.*refs/tags/##' | grep -v '\^{}' | sort -u)"
          # 共用 tests/semver.mjs(与 newest-tag.mjs / upstream-tag 的 compare-tags
          # 同一套排序键); STRICT=1: 已存在的 tag 本身也算"不新", 拒绝重发。
          newest="$(NEW_TAG="$NEW_TAG" EXISTING="$tags" STRICT=1 node tests/newest-tag.mjs)"
          if [ "$newest" = "true" ]; then refuse="no"; else refuse="yes"; fi
          echo "refuse=$refuse" >> "$GITHUB_OUTPUT"
          if [ "$refuse" = "yes" ]; then
            echo "refusing to release $NEW_TAG: not newer than the newest existing tag" >&2
          fi
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}

      # 先把修复分支快进到 main, 再在同一个 commit 上打 tag —— image.yml 由
      # tag 触发并 checkout 该 tag, 修复内容随之进入发布构建。
      - name: Fast-forward main with repair branch
        if: needs.commit.outputs.changed == 'true' && steps.guard.outputs.refuse == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          BRANCH: ${{ needs.commit.outputs.branch }}
        run: |
          set -euo pipefail
          # checkout 已 persist-credentials: false; 这里显式用 token URL 推送。
          # main 可能在 verify 的十几分钟里前进: 非快进 push 失败不应让整个发布
          # 作废 —— 镜像只依赖下面要打的 tag。失败时仍按 verified commit 打 tag,
          # 只在 tracker issue 上留一条人工同步 main 的提示。
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:main"; then
            echo "main fast-forwarded to the verified commit"
          else
            echo "::warning::main moved during verify; publishing the tag from the verified commit and leaving main untouched"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body \
                "The image was released from the verified commit, but \`main\` moved during verification, so the repair branch \`$BRANCH\` was not fast-forwarded. Merge it manually (or re-run release-prep for a later tag) so main contains the adaptation." || true
            fi
          fi

      - name: Push release tag via fine-grained PAT
        id: push-tag
        if: env.HAS_PAT == 'true' && steps.guard.outputs.refuse == 'no'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          set -euo pipefail
          git tag -f "$NEW_TAG"
          # 注意: 必须用 PAT 推 —— GITHUB_TOKEN 的 push 不触发 workflow,
          # GitHub App installation token 的 push 同样不触发(实测)。
          # fine-grained PAT 需带 "Workflows: read and write" 仓库权限。
          # 关键坑: actions/checkout 会配置 http.https://github.com/.extraheader
          # 为 GITHUB_TOKEN 的 Authorization 头, 该头对同一 host 的所有请求
          # 生效, 会覆盖 remote URL 里嵌的 PAT —— 不显式清掉的话, 这步"PAT
          # 推送"实际是 GITHUB_TOKEN 在推, 永远不触发 image.yml(2026-09-08
          # dsh-v0.1.3-alpha.2 事故的根因, 指纹诊断确认)。
          git remote add release "https://oauth2:${RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git -c "http.https://github.com/.extraheader=" push release "refs/tags/$NEW_TAG"

      # 最后一道闸门的触发确认: "tag 推上去了"不等于"发布开始了"。轮询
      # Actions API, image.yml 必须出现 event=push 且 head_branch 等于新 tag
      # 的 run; 超时未出现则本 job 失败 → 后续 close 步骤不会执行, notify
      # 会把诊断贴到 tracker issue, issue 保持打开, 不会静默断链。
      # 这里刻意只认 event=push: 本步骤验证的是 RELEASE_PAT 能否触发 push
      # workflow; 事后手工补跑的 workflow_dispatch 不能证明这一点。tracker
      # issue / health check 在 watcher 里接受任意 event 的 run。
      - name: Confirm image.yml was triggered by the tag push
        if: env.HAS_PAT == 'true' && steps.guard.outputs.refuse == 'no'
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          set -euo pipefail
          since="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          run_id=""
          # 实测触发延迟 2-6 分钟不等(2026-09-08 实测), 窗口放宽到 8 分钟。
          # 注意: gh api 没有 --jq -r/--arg(jq 命令行的参数), 必须管道给 jq。
          for _ in $(seq 1 60); do
            run_id="$(
              gh api "repos/${{ github.repository }}/actions/runs?event=push&created=>$since&per_page=10" 2>/dev/null \
                | jq -r --arg tag "$NEW_TAG" \
                    '.workflow_runs[] | select(.path == ".github/workflows/image.yml" and .head_branch == $tag) | .id' \
                | head -n1
            )" || true
            [ -n "$run_id" ] && break
            sleep 8
          done
          if [ -n "$run_id" ]; then
            url="${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
            echo "image.yml run $run_id was triggered by the $NEW_TAG push: $url"
            echo "run_url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: no image.yml run appeared within ~8 minutes of pushing $NEW_TAG." >&2
            echo "The push credential (RELEASE_PAT) likely lacks 'Workflows: read and write'." >&2
            echo "The tag exists in the repository. Once the PAT is fixed: delete and re-push" >&2
            echo "the tag, or run image.yml manually on refs/tags/$NEW_TAG." >&2
            exit 1
          fi

      - name: Close tracker issue (auto path)
        if: env.HAS_PAT == 'true' && steps.guard.outputs.refuse == 'no' && needs.contract.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          RUN_URL: ${{ steps.trigger.outputs.run_url }}
        run: |
          gh issue close "$ISSUE" --comment \
            "Verified and released: tag \`$NEW_TAG\` pushed and image.yml was confirmed triggered ([run]($RUN_URL)) — it is building and publishing the multi-arch image." \
            || true

      - name: Note refused downgrade on tracker issue
        if: steps.guard.outputs.refuse == 'yes' && needs.contract.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          gh issue comment "$ISSUE" --body \
            "Release of \`$NEW_TAG\` was refused: it is not newer than the newest \`dsh-v*\` tag already in this repository (downgrade guard)." \
            || true

      - name: 'Fallback: manual release instructions'
        # 拒绝降级时不得发"ready to release"指引: 两条矛盾评论会让照做的人
        # 把被守卫拦下的旧版本推上线(image.yml 会把 latest 拖回旧版)。
        if: env.HAS_PAT != 'true' && steps.guard.outputs.refuse == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          BRANCH: ${{ needs.commit.outputs.branch }}
        run: |
          set -euo pipefail
          {
            echo "## Ready to release \`$NEW_TAG\`"
            echo
            echo "All checks passed, but no RELEASE_PAT secret is configured, so the"
            echo "tag was not pushed automatically. To release:"
            echo
            if [ -n "$BRANCH" ]; then
              echo "    git fetch origin && git checkout $BRANCH"
              echo "    git push origin $BRANCH:main"
            fi
            echo "    git tag $NEW_TAG origin/${BRANCH:-main}"
            echo "    git push origin $NEW_TAG"
          } > /tmp/issue-comment.md
          if [ -z "$ISSUE" ]; then
            cat /tmp/issue-comment.md
            exit 0
          fi
          # 同一条 issue 只保留一条状态评论: 有 marker 就 PATCH, 否则新建。
          # (每次 attempt 追加一条会把 issue 变成刷屏的失败日志。)
          existing="$(gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- release-prep-status -->")) | .id' \
            | tail -n1 || true)"
          if [ -n "$existing" ]; then
            jq -Rs '{body: .}' /tmp/issue-comment.md \
              | gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" --input - >/dev/null
            echo "updated status comment $existing on issue #$ISSUE"
          else
            gh issue comment "$ISSUE" --body-file /tmp/issue-comment.md
          fi

  notify:
    name: Report failure to tracker issue
    needs: [contract, prep, commit, verify, release]
    if: >-
      ${{
        always() &&
        (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read # download-artifact 取回 prep 已上传的 reasoning log
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ needs.contract.outputs.issue }}
      NEW_TAG: ${{ needs.contract.outputs.new_tag }}
    steps:
      # agent 的失败原因在容器的 stderr 里(prep 步骤重定向到 reasoning log),
      # 而 notify 跑在宿主 runner 上: 取回 prep 已上传(且已脱敏)的 artifact,
      # 让 issue 上的失败说明自带诊断 —— 2026-09-22 dsh-v0.1.7-alpha.2 事故里
      # issue 只有一句 "See the workflow run", 真正的原因
      # (MISSING_CREDENTIAL … "deepseek-official")藏在 artifact 里。
      # artifact 不存在(如 contract 阶段就失败)时继续, 注释里就没有该段。
      - name: Fetch the agent reasoning log
        if: needs.prep.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: agent-reasoning
          path: /tmp/agent-reasoning

      - name: Post failure note
        env:
          # 与 prep 的报告步骤同法脱敏: reasoning log 是 LLM 自由文本, 发到
          # 公开 issue 前必须清掉本 job 可见的密钥值。
          TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
          TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
        run: |
          set -euo pipefail
          {
            echo "<!-- release-prep-status -->"
            echo "## Release prep did not complete for \`$NEW_TAG\`"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| contract | ${{ needs.contract.result }} |"
            echo "| prep (agent) | ${{ needs.prep.result }} |"
            echo "| commit | ${{ needs.commit.result }} |"
            echo "| verify | ${{ needs.verify.result }} |"
            echo "| release | ${{ needs.release.result }} |"
            echo
            if [ "${{ needs.release.result }}" = "failure" ]; then
              echo "The tag may already exist while image.yml never started (failed trigger"
              echo "confirmation): the push credential (RELEASE_PAT) needs the"
              echo "\`Workflows: read and write\` repository permission. Fix the PAT, then"
              echo "delete and re-push the tag, or run image.yml manually on the tag ref."
              echo
            fi
            echo "See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for logs."
            # 只发分类后的诊断, 不引用原始日志: reasoning log 里有中转器的
            # 内部报错/request id, 贴到公开 issue 既泄露内部信息又容易被误读。
            # 完整日志在 run 的 agent-reasoning artifact 里(已脱敏)。
            if [ -s /tmp/agent-reasoning/agent-reasoning.log ]; then
              if grep -qE 'API error \(5[0-9][0-9]\)|convert_request_failed' /tmp/agent-reasoning/agent-reasoning.log; then
                diag="The model relay returned a 5xx error before the agent could run (provider-side; see the run logs)."
              elif grep -qiE 'no sandbox backend|SANDBOX_UNAVAILABLE' /tmp/agent-reasoning/agent-reasoning.log; then
                diag="The agent's shell was unavailable: the prep image has no usable sandbox backend."
              elif grep -qiE 'MISSING_CREDENTIAL|unauthorized|401' /tmp/agent-reasoning/agent-reasoning.log; then
                diag="The agent could not authenticate to the model provider (credential or config)."
              else
                diag="The agent exited before producing a report; the reasoning log is attached to the run as an artifact."
              fi
              echo
              echo "<details><summary>Agent diagnostic (classified; no raw log quoted)</summary>"
              echo
              echo "$diag"
              echo
              echo "</details>"
              echo
            fi
            echo "The release was NOT published; the tracker issue stays open."
          } > /tmp/issue-comment.md
          for v in "$TERNARYBIT_API_KEY" "$TERNARYBIT_URL"; do
            [ -n "$v" ] || continue
            esc="$(printf '%s' "$v" | sed 's/[^[:alnum:]]/\\&/g')"
            sed -i "s/$esc/[REDACTED]/g" /tmp/issue-comment.md
          done
          sed -i -E 's/(github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{16,})/[REDACTED-TOKEN]/g' \
            /tmp/issue-comment.md
          # 本 job 存在的唯一意义就是这条失败说明: 发不出去必须红, 不能
          # 吞掉 —— "job 绿但 issue 无声"正是 2026-09-09 事故的形态之一。
          if [ -z "$ISSUE" ]; then
            cat /tmp/issue-comment.md
            exit 0
          fi
          # 同一条 issue 只保留一条状态评论: 有 marker 就 PATCH, 否则新建。
          # (每次 attempt 追加一条会把 issue 变成刷屏的失败日志。)
          existing="$(gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- release-prep-status -->")) | .id' \
            | tail -n1 || true)"
          if [ -n "$existing" ]; then
            jq -Rs '{body: .}' /tmp/issue-comment.md \
              | gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" --input - >/dev/null
            echo "updated status comment $existing on issue #$ISSUE"
          else
            gh issue comment "$ISSUE" --body-file /tmp/issue-comment.md
          fi
