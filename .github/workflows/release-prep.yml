name: Release prep

# 上游 dsh tag 的自动发版准备流水线(与 docs/releasing.md / AGENTS.md 同步维护):
#
#   contract — tests/contract.sh 静态契约检查(docs/upstream-contract.md 的机器形态),
#              数秒判定上游 tag 是否存在兼容漂移; 本仓库已有同名 tag 时幂等跳过
#   prep     — (漂移时)在本仓库上一个发布 tag 的镜像里以 dsh headless 运行修复
#              agent(dsh 数据在独立 HOME, settings 由 secrets 生成, 模型走
#              自建中转的 openai-completions 端点): 读上游 diff + 契约文档,
#              最小化修复(通常是 container/plugin/scripts/
#              patch-client.js 的候选串); 每次发布(含无漂移)都对照契约文档
#              § Simplification triggers 审视上游新能力, 能干掉 hack 就删掉
#              (适配层随上游演进保持最小); 结果推 release-prep/<tag> 分支,
#              报告(含 Adaptation review 段)贴到 tracker issue —— 该报告即
#              本 tag 适配层决策记录, 改动本身随 release commits 进入 release note
#   verify   — 用修复后的树以 DSH_TAG=<新 tag> 构建镜像并跑 tests/smoke.sh
#              (闸门不信任 agent 自验)
#   release  — verify 通过后把修复分支快进到 main, 用 RELEASE_PAT(fine-grained
#              PAT, 必须带 "Workflows: read and write" 仓库权限)推 dsh-v* tag,
#              随后轮询 Actions API 确认 image.yml 已被该 push 触发 —— 未触发则
#              job 失败、issue 保持打开(2026-09-08 dsh-v0.1.3-alpha.2 事故:
#              tag 推上去了但 image.yml 从未被触发, issue 却被直接关闭);
#              → image.yml 完成构建/冒烟/发布/Release; 未配置 PAT 时降级为在
#              tracker issue 留手动发版命令
#   notify   — 任一环节失败时在 tracker issue 留诊断说明
#
# 触发: upstream-tag.yml 发现新上游 tag 后 repository_dispatch(事件
# upstream-dsh-tag, 携带 new_tag/old_tag/issue), 或手动 dispatch 填 new_tag。
# 配置: secrets TERNARYBIT_API_KEY / TERNARYBIT_URL / AGENT_MODEL(agent 模型后端,
#       自建中转, openai-completions 协议),
#       可选 secret RELEASE_PAT(fine-grained, 需勾选 "Workflows: read and write"
#       仓库权限, 否则 push 的 tag 不产生 push event, 不会触发下游)。

on:
  repository_dispatch:
    types: [upstream-dsh-tag]
  workflow_dispatch:
    inputs:
      new_tag:
        description: 'Upstream dsh-v* tag to prep and release (e.g. dsh-v0.1.2-rc.1)'
        required: true
        type: string

# 默认只读 + issue 写; prep/release 需要写 contents 的在各自 job 里声明
permissions:
  contents: read
  issues: write

concurrency:
  group: release-prep
  cancel-in-progress: false

# 容器 job(自己的镜像)的默认 run shell 是 sh(dash), 不支持 pipefail;
# 全 workflow 显式用 bash(host runner 上的 job 本来也是 bash, 行为不变)。
defaults:
  run:
    shell: bash

env:
  UPSTREAM_REPO: ${{ vars.DSH_UPSTREAM_REPO || 'deepseek-ai/deepseek-harness' }}
  IMAGE_NAME: ghcr.io/niyueee/dsh-container

jobs:
  contract:
    name: Contract check against upstream tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new_tag: ${{ steps.resolve.outputs.new_tag }}
      old_tag: ${{ steps.resolve.outputs.old_tag }}
      issue: ${{ steps.resolve.outputs.issue }}
      verdict: ${{ steps.contract.outputs.verdict }}
      ancestor: ${{ steps.triage.outputs.ancestor }}
      fatal: ${{ steps.triage.outputs.fatal }}
      agent_required: ${{ steps.triage.outputs.agent_required }}
      surface_hits: ${{ steps.triage.outputs.surface_hits }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tags and tracker issue
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            new_tag="${{ github.event.client_payload.new_tag }}"
            old_tag="${{ github.event.client_payload.old_tag }}"
            issue="${{ github.event.client_payload.issue }}"
          else
            new_tag="${{ inputs.new_tag }}"
            old_tag=""
            issue=""
          fi
          # tag 形状校验(与 tests/contract.sh、upstream-tag.yml 保持一致)
          [[ "$new_tag" =~ ^dsh-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "invalid new_tag: $new_tag" >&2; exit 1; }
          # 幂等: 本仓库已有同名 tag(已发版或重复 dispatch)→ 跳过。
          # ls-remote 退出码语义: 0 = 匹配到(存在), 2 = 无匹配(不存在),
          # 其他非零 = 传输错误 —— 必须重试后再放弃, 否则网络抖动会被误判成
          # "tag 不存在", 白白重跑 verify(甚至重复发版)。
          tag_exists=0
          for _ in 1 2 3; do
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$new_tag" >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 0 ]; then
              tag_exists=1
              break
            fi
            [ "$rc" = 2 ] && break
            echo "ls-remote transport error (rc=$rc); retrying..." >&2
            sleep 5
          done
          verdict="ready"
          if [ "$tag_exists" = 1 ]; then
            echo "tag $new_tag already exists in this repository; nothing to do"
            verdict="skipped"
          fi
          # old_tag 兜底: dispatch 未携带时取本仓库最新 dsh-v* tag(sort -V 对
          # 预发布段排序不完美, 但只用于圈定上游 compare 范围, 可接受)
          if [ -z "$old_tag" ]; then
            old_tag="$(git ls-remote --tags origin 'refs/tags/dsh-v*' \
              | sed -E 's#.*refs/tags/(dsh-v[0-9.]+.*)$#\1#' | grep -v '\^{}' \
              | sort -V | tail -n1 || true)"
          fi
          # issue 兜底: 找标题匹配的未关闭 tracker issue
          if [ -z "$issue" ]; then
            issue="$(gh issue list --state open --json number,title \
              --jq ".[] | select(.title == \"New upstream dsh release available: $new_tag\") | .number" \
              | head -n1 || true)"
          fi
          {
            echo "new_tag=$new_tag"
            echo "old_tag=$old_tag"
            echo "issue=$issue"
            echo "verdict=$verdict"
          } >> "$GITHUB_OUTPUT"

      - name: Contract check
        id: contract
        run: |
          set -euo pipefail
          # skip 逻辑放本步内部而非 step if: 被跳过的 step 不产出 output,
          # job output verdict 会变成空串, 下游的 != 'skipped' 判断就会误放行
          # (首轮演练踩过的坑)。
          if [ "${{ steps.resolve.outputs.verdict }}" = "skipped" ]; then
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 注意不能 -e 吞掉退出码 2(2 = 漂移, 是预期结果之一)
          set +e
          bash tests/contract.sh --tag "${{ steps.resolve.outputs.new_tag }}" \
            --repo "$UPSTREAM_REPO" 2>&1 | tee /tmp/contract-report.txt
          rc="${PIPESTATUS[0]}"
          set -e
          case "$rc" in
            0) verdict="clean" ;;
            2) verdict="drift" ;;
            *) echo "contract.sh infrastructure error (rc=$rc)" >&2; exit 1 ;;
          esac
          cat /tmp/contract-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Collect upstream diff (complete file list)
        if: steps.contract.outputs.verdict != 'skipped'
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.resolve.outputs.new_tag }}
          OLD_TAG: ${{ steps.resolve.outputs.old_tag }}
        run: |
          set -euo pipefail
          # 完整文件清单用 git 拿: compare API 有 300 文件上限且按路径排序
          # 截断, 会漏掉适配面(packages/ 恰好在截断区, 实测过)。git 失败
          # 才退回 compare payload —— 分诊脚本会识别截断并保守放行 agent。
          files_source="compare"
          if [ -n "$OLD_TAG" ] \
              && git clone --quiet --depth 1 --branch "$NEW_TAG" \
                   "https://github.com/$UPSTREAM_REPO.git" /tmp/triage-upstream 2>/dev/null \
              && git -C /tmp/triage-upstream fetch --quiet --depth 1 origin tag "$OLD_TAG" 2>/dev/null; then
            git -C /tmp/triage-upstream diff --name-only "$OLD_TAG" "$NEW_TAG" \
              > /tmp/triage-files.txt
            files_source="git"
          fi
          # 祖先信号(误派发检测)与兜底清单: compare payload
          if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$UPSTREAM_REPO/compare/${OLD_TAG}...${NEW_TAG}" \
                > /tmp/upstream-diff.json 2>/dev/null; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$UPSTREAM_REPO/commits/$NEW_TAG" \
              > /tmp/upstream-diff.json
          fi
          echo "files_source=$files_source" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status // empty' /tmp/upstream-diff.json 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Diff triage (code-level agent admission gate)
        if: steps.contract.outputs.verdict != 'skipped'
        id: triage
        run: |
          set -euo pipefail
          # 从契约报告解析 MISS 的 check-id(DRIFT: id1 id2 ... 行)
          missed="$(sed -n 's/^DRIFT: //p' /tmp/contract-report.txt \
            | tr ' ' '\n' | grep -v '^$' | paste -sd' ' - || true)"
          args=(--verdict "${{ steps.contract.outputs.verdict }}" \
            --missed "$missed" --status "${{ steps.diff.outputs.status }}")
          if [ -f /tmp/triage-files.txt ]; then
            tests/triage-diff.sh --files /tmp/triage-files.txt "${args[@]}" > /tmp/triage.txt
          elif [ -f /tmp/upstream-diff.json ]; then
            tests/triage-diff.sh --diff /tmp/upstream-diff.json "${args[@]}" > /tmp/triage.txt
          else
            # 无任何 diff 数据: 无法证明安全, 保守放行 agent
            printf 'TRIAGE ancestor=no\nTRIAGE fatal=no\nTRIAGE surface_hits=unknown(no-diff-data)\nTRIAGE agent_required=yes\n' \
              > /tmp/triage.txt
          fi
          cat /tmp/triage.txt | tee -a "$GITHUB_STEP_SUMMARY"
          while IFS='=' read -r k v; do
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < <(sed 's/^TRIAGE //' /tmp/triage.txt)

      - name: Fail fast on fence drift or mis-dispatched tag
        if: >-
          ${{
            steps.contract.outputs.verdict != 'skipped' &&
            (steps.triage.outputs.fatal == 'yes' || steps.triage.outputs.ancestor == 'yes')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.resolve.outputs.issue }}
          NEW_TAG: ${{ steps.resolve.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ "${{ steps.triage.outputs.fatal }}" = "yes" ]; then
            msg="## Release prep stopped: security-fence contract drift in \`$NEW_TAG\`

            \`tests/contract.sh\` reports \`server.request_fence\` missing — the /api header trust fence this image's proxy relies on is gone or redesigned upstream. Per policy this is reported, never worked around: the agent was NOT admitted and no release was attempted."
          else
            msg="## Release prep stopped: \`$NEW_TAG\` is not newer than the last released tag (mis-dispatch)

            The upstream compare reports this tag as *behind*; nothing was built or released."
          fi
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$msg" || true
          fi
          printf '%s\n' "$msg" >&2
          exit 1

      - name: Note code-level triage decision
        if: >-
          ${{
            steps.contract.outputs.verdict != 'skipped' &&
            steps.triage.outputs.agent_required == 'no' &&
            steps.triage.outputs.fatal == 'no' &&
            steps.triage.outputs.ancestor == 'no' &&
            steps.resolve.outputs.issue != ''
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.resolve.outputs.issue }}
          NEW_TAG: ${{ steps.resolve.outputs.new_tag }}
          HITS: ${{ steps.triage.outputs.surface_hits }}
        run: |
          gh issue comment "$ISSUE" --body \
            "## Diff triage (code-level) — agent not admitted for \`$NEW_TAG\`

            Contract verdict: \`${{ steps.contract.outputs.verdict }}\`; the upstream diff does not touch the adaptation surface (hits: \`${HITS}\`). No agent review needed; verify runs on the default branch." || true

  prep:
    name: Agent drift repair + adaptation review (dsh)
    needs: contract
    # 入场条件(代码级分诊, tests/triage-diff.sh): 契约漂移(非围栏类)或 diff
    # 命中适配面才唤醒 agent; 围栏漂移/误派发已在 contract job 快速失败。
    # 仅当本仓库已有该 tag(幂等跳过)时不跑。
    if: >-
      ${{
        needs.contract.outputs.verdict != 'skipped' &&
        needs.contract.outputs.agent_required == 'yes' &&
        needs.contract.outputs.fatal != 'yes' &&
        needs.contract.outputs.ancestor != 'yes'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # 推 release-prep/<tag> 修复分支
      issues: write
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
      changed: ${{ steps.commit.outputs.changed }}
    container:
      # 用本仓库上一个发布 tag 的镜像当 agent 运行时: 自带 dsh CLI 与全套
      # 工具链, 镜像不可变(不再依赖 codex-universal:latest 的可变漂移)。
      # old_tag 由 contract job 解析, 首次发版为空时兜底 latest。
      # 镜像入口会启动 dsh web, CI 里必须绕过(--entrypoint ""); --user root
      # 规避 Actions workspace 属主与 git dubious-ownership 问题。
      image: ghcr.io/niyueee/dsh-container:${{ needs.contract.outputs.old_tag || 'latest' }}
      options: --entrypoint "" --user root
    env:
      # dsh 数据(settings/sessions)落在 Actions 容器 job 的 HOME(/github/home),
      # 不落 workspace; git 全局 safe.directory 由 Write dsh settings 步骤注入。
      GIT_CONFIG_GLOBAL: /tmp/dsh-ci-gitconfig
      TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
      TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
      AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
      # 代码级分诊结果: 适配面命中的上游路径(agent 的聚焦范围)
      SURFACE_HITS: ${{ needs.contract.outputs.surface_hits }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect drift context
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          OLD_TAG: ${{ needs.contract.outputs.old_tag }}
        run: |
          set -euo pipefail
          # 容器里没有 gh CLI, 直接用 curl 调 REST API(公开仓库, token 提额)
          if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$UPSTREAM_REPO/compare/${OLD_TAG}...${NEW_TAG}" \
                > /tmp/upstream-diff.json 2>/dev/null; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$UPSTREAM_REPO/commits/$NEW_TAG" \
              > /tmp/upstream-diff.json
          fi
          # 上游源码 checkout, 让 agent 完全离线分析(无网络需求)
          git clone --quiet --depth 1 --branch "$NEW_TAG" \
            "https://github.com/$UPSTREAM_REPO.git" /tmp/upstream
          # 祖先信号: compare status=behind 表示 NEW_TAG 落后于已有发布
          # (误派发旧版本), 传给 agent 作为早退指引
          status="$(jq -r '.status // empty' /tmp/upstream-diff.json 2>/dev/null || true)"
          {
            echo "is_ancestor=$([ "$status" = behind ] && echo yes || echo no)"
          } >> "$GITHUB_ENV"
          echo "context ready: /tmp/upstream-diff.json, /tmp/upstream (is_ancestor=${is_ancestor:-no})"

      - name: Write dsh settings
        env:
          TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
          TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.dsh"
          cat > "$HOME/.dsh/settings.yaml" <<EOF
          agent-default-model:
            provider: ternarybit
            model: "${AGENT_MODEL}"
          permission:
            defaultPreset: workspace-write
          llm-pi-ai:
            providers:
              ternarybit:
                displayName: TernaryBit
                apiKeyEnv: TERNARYBIT_API_KEY
                api: openai-completions
                baseURL: "${TERNARYBIT_URL}"
                models:
                  - id: "${AGENT_MODEL}"
                    name: "${AGENT_MODEL}"
                    contextWindow: 1000000
                    maxTokens: 384000
                    input:
                      - text
                    reasoningEfforts:
                      off: null
                      low: low
                      high: high
                      max: max
          EOF
          # workspace 属主是 runner uid, 容器内以 root 跑 —— git 会报
          # dubious ownership; 全局 safe.directory 注入(与 commit 步骤同法)
          printf '[safe]\n\tdirectory = %s\n' "$GITHUB_WORKSPACE" > "$GIT_CONFIG_GLOBAL"

      - name: Run dsh agent (drift repair + adaptation review)
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # stdout = 最终回复(即 agent 报告); stderr = 推理过程(留作排障,
          # 见下方 artifact)。dsh 数据在独立 HOME($HOME/.dsh), 不污染 workspace。
          dsh --profile headless "$(cat prompts/release-prep.md)" \
            > /tmp/agent-report.md 2> /tmp/agent-reasoning.log
          [ -s /tmp/agent-report.md ] \
            || { echo "(agent produced no final message; see reasoning log)" > /tmp/agent-report.md; }

      - name: Upload agent reasoning log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reasoning
          path: /tmp/agent-reasoning.log
          if-no-files-found: ignore

      - name: Commit repair branch
        id: commit
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          set -euo pipefail
          # 容器 job 经典坑: workspace 文件属主是宿主 runner 的 UID, 容器内
          # 用户与其不同, git 的 dubious-ownership 检查会拒绝一切操作
          # (实测报 "detected dubious ownership", 上一轮的 "not in a git
          # directory" 是同一根因在 config 写入路径上的另一种形态)。
          # safe.directory 只在 system/global 作用域生效, 故用
          # GIT_CONFIG_GLOBAL 注入, 不依赖 HOME 可写。
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          printf '[safe]\n\tdirectory = %s\n' "$GITHUB_WORKSPACE" > "$GIT_CONFIG_GLOBAL"
          cd "${GITHUB_WORKSPACE:-$PWD}"
          git rev-parse --is-inside-work-tree
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "agent made no changes; verify will run on the default branch"
            exit 0
          fi
          # 安全: agent 修改路径白名单 —— .github/workflows 是本流水线的闸门
          # 本体, agent(受提示注入影响的 LLM)永远不得改动; 白名单之外的
          # 路径一律 fail loudly 而不是默默提交进 main。
          bad="$(git diff --name-only | grep -vE '^(container/|docs/|tests/|prompts/|Containerfile)' || true)"
          if [ -n "$bad" ]; then
            echo "agent modified files outside the allowlist:" >&2
            echo "$bad" >&2
            exit 1
          fi
          branch="release-prep/${NEW_TAG}"
          git checkout -b "$branch"
          git add -A
          git -c user.name="dsh-container release agent" \
              -c user.email="actions@github.com" \
              commit -m "fix: adapt to upstream $NEW_TAG (agent-prepared)"
          git push origin "$branch"
          {
            echo "changed=true"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Report to tracker issue
        if: needs.contract.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TERNARYBIT_API_KEY: ${{ secrets.TERNARYBIT_API_KEY }}
          TERNARYBIT_URL: ${{ secrets.TERNARYBIT_URL }}
        run: |
          set -euo pipefail
          {
            echo "## Agent drift review — \`$NEW_TAG\`"
            echo
            cat /tmp/agent-report.md
            echo
            if [ -n "$BRANCH" ]; then
              echo "Repair branch: \`$BRANCH\` — the verify job will build and smoke-test it before any release."
            else
              echo "The agent judged no repository changes necessary; the verify job will run on the default branch."
            fi
          } > /tmp/issue-comment.md
          # 密钥防泄漏: 报告由 LLM 生成并会发到公开仓库的 issue 上。发布前
          # 先把本 job 已知的密钥值与常见 token 形态脱敏; 命中即告警。
          # (GITHUB_TOKEN 与 RELEASE_PAT 不在本 job 的 env 里, agent 接触不到。)
          leak=0
          for v in "$TERNARYBIT_API_KEY" "$TERNARYBIT_URL"; do
            [ -n "$v" ] || continue
            if grep -qF -- "$v" /tmp/issue-comment.md; then
              esc="$(printf '%s' "$v" | sed 's/[^[:alnum:]]/\\&/g')"
              sed -i "s/$esc/[REDACTED]/g" /tmp/issue-comment.md
              leak=1
            fi
          done
          if grep -qE 'github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{16,}' \
              /tmp/issue-comment.md; then
            sed -i -E 's/(github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{16,})/[REDACTED-TOKEN]/g' \
              /tmp/issue-comment.md
            leak=1
          fi
          [ "$leak" = 1 ] \
            && echo "warning: secret-like patterns were redacted from the agent report" >&2 || true
          # 容器里没有 gh: curl 发评论, node 做 JSON 转义(报告是任意
          # markdown; 镜像自带 node, 没有 python3)。报告是锦上添花 ——
          # 修复分支已推送, 此步失败不应让一次成功的 prep 整体失败, 故容错降级。
          if command -v node >/dev/null 2>&1; then
            body_json="$(node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.stringify({body:d})))' \
              < /tmp/issue-comment.md)"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE/comments" \
              -d "$body_json" > /dev/null \
              || echo "warning: failed to post the agent report to issue #$ISSUE" >&2
          else
            echo "warning: node unavailable; agent report not posted to issue #$ISSUE" >&2
          fi

  verify:
    name: Build + smoke test (pre-release gate)
    needs: [contract, prep]
    # prep 失败时不跑(等修复重试); prep 被跳过(契约干净)或成功时都跑。
    # !cancelled() 保证 prep 失败时本 job 显式 skipped 而不是被 needs 连坐。
    if: >-
      ${{
        !cancelled() &&
        needs.contract.result == 'success' &&
        needs.contract.outputs.verdict != 'skipped' &&
        (needs.prep.result == 'success' || needs.prep.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 有修复分支时验证修复后的树; 干净路径验证默认分支
          ref: ${{ needs.prep.outputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 与 image.yml 的发布构建同一 Containerfile / DSH_TAG 语义:
      # 镜像从上游 <new_tag> 源码构建, 这里只验证不推送。
      - name: Build image from new upstream tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:prep-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_GIT_SHA=${{ github.sha }}
            BUILD_GIT_REF=${{ github.ref_name }}
            BUILD_VERSION=latest
            DSH_TAG=${{ needs.contract.outputs.new_tag }}

      - name: Smoke test
        run: |
          tests/smoke.sh "${IMAGE_NAME}:prep-${{ github.run_id }}" \
            --expect-dsh-version "${NEW_TAG#dsh-v}"
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}

  release:
    name: Publish tag (or fall back to manual)
    needs: [contract, prep, verify]
    if: >-
      ${{
        !cancelled() &&
        needs.verify.result == 'success' &&
        needs.contract.outputs.verdict != 'skipped'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 快进 main 与(降级路径)文档提示
      issues: write
      actions: read   # 推 tag 后轮询确认 image.yml 是否真的被触发
    env:
      # secrets 不能直接用于 if, 借 env 间接判断是否配置了发版 PAT
      HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.branch || github.ref }}

      # 降级保护: 新 tag 必须比本仓库现有最新 dsh-v* tag 更新(semver 语义, 与
      # upstream-tag.yml 的排序键一致)才允许发版 —— 防止误 dispatch 旧 tag 把
      # latest 拖回旧版本。拒绝时不碰 main、不推 tag, 只在 tracker issue 留言。
      - name: 'Guard: refuse downgrade releases'
        id: guard
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags origin 'refs/tags/dsh-v*' \
            | sed -E 's#.*refs/tags/##' | grep -v '\^{}' | sed 's/^dsh-v//' | sort -u)"
          refuse="$(NEW_TAG="${NEW_TAG#dsh-v}" EXISTING="$tags" node -e '
            const key = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(v);
              if (!m) return null;
              const core = [m[1], m[2], m[3]].map((s) => s.padStart(8, "0")).join(".");
              const pre = m[4]
                ? m[4].split(".").map((id) => (/^\d+$/.test(id) ? `0${id.padStart(12, "0")}` : `1${id}`)).join(".")
                : "~";
              return `${core}|${pre}`;
            };
            const nt = key(process.env.NEW_TAG);
            if (!nt) { console.error("bad new tag: " + process.env.NEW_TAG); process.exit(1); }
            const max = process.env.EXISTING.split("\n").filter(Boolean).map(key).filter(Boolean).sort().pop();
            process.stdout.write(max !== undefined && max >= nt ? "yes" : "no");
          ')"
          echo "refuse=$refuse" >> "$GITHUB_OUTPUT"
          if [ "$refuse" = "yes" ]; then
            echo "refusing to release $NEW_TAG: not newer than the newest existing tag" >&2
          fi
        env:
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}

      # 先把修复分支快进到 main, 再在同一个 commit 上打 tag —— image.yml 由
      # tag 触发并 checkout 该 tag, 修复内容随之进入发布构建。
      - name: Fast-forward main with repair branch
        if: needs.prep.outputs.changed == 'true' && steps.guard.outputs.refuse == 'no'
        run: git push origin "HEAD:main"

      - name: Push release tag via fine-grained PAT
        id: push-tag
        if: env.HAS_PAT == 'true' && steps.guard.outputs.refuse == 'no'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          set -euo pipefail
          git tag -f "$NEW_TAG"
          # 注意: 必须用 PAT 推 —— GITHUB_TOKEN 的 push 不触发 workflow,
          # GitHub App installation token 的 push 同样不触发(实测)。
          # fine-grained PAT 需带 "Workflows: read and write" 仓库权限。
          # 关键坑: actions/checkout 会配置 http.https://github.com/.extraheader
          # 为 GITHUB_TOKEN 的 Authorization 头, 该头对同一 host 的所有请求
          # 生效, 会覆盖 remote URL 里嵌的 PAT —— 不显式清掉的话, 这步"PAT
          # 推送"实际是 GITHUB_TOKEN 在推, 永远不触发 image.yml(2026-09-08
          # dsh-v0.1.3-alpha.2 事故的根因, 指纹诊断确认)。
          git remote add release "https://oauth2:${RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git -c "http.https://github.com/.extraheader=" push release "refs/tags/$NEW_TAG"

      # 最后一道闸门的触发确认: "tag 推上去了"不等于"发布开始了"。轮询
      # Actions API, image.yml 必须出现 event=push 且 head_branch 等于新 tag
      # 的 run; 超时未出现则本 job 失败 → 后续 close 步骤不会执行, notify
      # 会把诊断贴到 tracker issue, issue 保持打开, 不会静默断链。
      - name: Confirm image.yml was triggered by the tag push
        if: env.HAS_PAT == 'true' && steps.guard.outputs.refuse == 'no'
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          set -euo pipefail
          since="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          run_id=""
          # 实测触发延迟 2-6 分钟不等(2026-09-08 实测), 窗口放宽到 8 分钟。
          # 注意: gh api 没有 --jq -r/--arg(jq 命令行的参数), 必须管道给 jq。
          for _ in $(seq 1 60); do
            run_id="$(
              gh api "repos/${{ github.repository }}/actions/runs?event=push&created=>$since&per_page=10" 2>/dev/null \
                | jq -r --arg tag "$NEW_TAG" \
                    '.workflow_runs[] | select(.path == ".github/workflows/image.yml" and .head_branch == $tag) | .id' \
                | head -n1
            )" || true
            [ -n "$run_id" ] && break
            sleep 8
          done
          if [ -n "$run_id" ]; then
            url="${{ github.server_url }}/${{ github.repository }}/actions/runs/$run_id"
            echo "image.yml run $run_id was triggered by the $NEW_TAG push: $url"
            echo "run_url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: no image.yml run appeared within ~8 minutes of pushing $NEW_TAG." >&2
            echo "The push credential (RELEASE_PAT) likely lacks 'Workflows: read and write'." >&2
            echo "The tag exists in the repository. Once the PAT is fixed: delete and re-push" >&2
            echo "the tag, or run image.yml manually on refs/tags/$NEW_TAG." >&2
            exit 1
          fi

      - name: Close tracker issue (auto path)
        if: env.HAS_PAT == 'true' && steps.guard.outputs.refuse == 'no' && needs.contract.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          RUN_URL: ${{ steps.trigger.outputs.run_url }}
        run: |
          gh issue close "$ISSUE" --comment \
            "Verified and released: tag \`$NEW_TAG\` pushed and image.yml was confirmed triggered ([run]($RUN_URL)) — it is building and publishing the multi-arch image." \
            || true

      - name: Note refused downgrade on tracker issue
        if: steps.guard.outputs.refuse == 'yes' && needs.contract.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
        run: |
          gh issue comment "$ISSUE" --body \
            "Release of \`$NEW_TAG\` was refused: it is not newer than the newest \`dsh-v*\` tag already in this repository (downgrade guard)." \
            || true

      - name: 'Fallback: manual release instructions'
        if: env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.contract.outputs.issue }}
          NEW_TAG: ${{ needs.contract.outputs.new_tag }}
          BRANCH: ${{ needs.prep.outputs.branch }}
        run: |
          set -euo pipefail
          {
            echo "## Ready to release \`$NEW_TAG\`"
            echo
            echo "All checks passed, but no RELEASE_PAT secret is configured, so the"
            echo "tag was not pushed automatically. To release:"
            echo
            if [ -n "$BRANCH" ]; then
              echo "    git fetch origin && git checkout $BRANCH"
              echo "    git push origin $BRANCH:main"
            fi
            echo "    git tag $NEW_TAG origin/${BRANCH:-main}"
            echo "    git push origin $NEW_TAG"
          } > /tmp/issue-comment.md
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file /tmp/issue-comment.md
          else
            cat /tmp/issue-comment.md
          fi

  notify:
    name: Report failure to tracker issue
    needs: [contract, prep, verify, release]
    if: >-
      ${{
        always() &&
        (needs.contract.result == 'failure' || needs.prep.result == 'failure' ||
         needs.verify.result == 'failure' || needs.release.result == 'failure')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ needs.contract.outputs.issue }}
      NEW_TAG: ${{ needs.contract.outputs.new_tag }}
    steps:
      - name: Post failure note
        run: |
          set -euo pipefail
          {
            echo "## Release prep failed for \`$NEW_TAG\`"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| contract | ${{ needs.contract.result }} |"
            echo "| prep (agent) | ${{ needs.prep.result }} |"
            echo "| verify | ${{ needs.verify.result }} |"
            echo "| release | ${{ needs.release.result }} |"
            echo
            if [ "${{ needs.release.result }}" = "failure" ]; then
              echo "The tag may already exist while image.yml never started (failed trigger"
              echo "confirmation): the push credential (RELEASE_PAT) needs the"
              echo "\`Workflows: read and write\` repository permission. Fix the PAT, then"
              echo "delete and re-push the tag, or run image.yml manually on the tag ref."
              echo
            fi
            echo "See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for logs."
            echo "The release was NOT published; the tracker issue stays open."
          } > /tmp/issue-comment.md
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file /tmp/issue-comment.md || true
          else
            cat /tmp/issue-comment.md
          fi
