# Dependabot 定期版本更新配置。
# 注意: Dependabot 没有"监视另一个仓库 git tag"的 ecosystem(它只认
# package-ecosystem: github-actions / docker / npm 等), 所以上游 dsh 的
# dsh-v* tag 由 .github/workflows/upstream-tag.yml 的定时任务监视。
# 这里只覆盖本仓库能直接 pin 的依赖:
#   - github-actions: 所有 workflow 里 pin 到 commit SHA 的 action(带 vN 注释,
#     Dependabot 会同时更新 SHA 和注释)
# 基础镜像 BASE_IMAGE 默认是移动 tag(随构建取当前 debian:13-slim), 且位于
# ARG 里, Dependabot 的 docker ecosystem 无法自动更新它; 需要固定时按
# docs/build.md 显式传 digest。这里刻意不配置 docker ecosystem, 避免造成
# "基础镜像会自动更新"的错觉。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
