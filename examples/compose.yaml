# Start:   docker compose -f examples/compose.yaml up -d
# Podman:  podman-compose -f examples/compose.yaml up -d
#
# Pulls the published GHCR image; no local build is required.
# See docs/deployment.md for the full guide.
#
# Networking: plain bridge networking with host port 3081. dsh web listens on
# 127.0.0.1 inside the container (npm releases reject --host 0.0.0.0); Caddy
# listens on 0.0.0.0:3081 and rewrites Host/Origin to loopback before forwarding
# to dsh on 127.0.0.1:3080.
#
# Persistence: the whole /home/dsh directory is one named volume (the user
# layer). System packages and /usr/local are replaced on image upgrades while
# user state and user-installed tools survive.

services:
  dsh:
    image: ghcr.io/niyueee/dsh-container:latest
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3081:3081"
    environment:
      # Runtime configuration surface: auth pair + optional auto-update.
      # Auto-update is off by default; set to "1" to follow npm latest on boot.
      DSH_AUTO_UPDATE: "${DSH_AUTO_UPDATE:-0}"
      # Set both auth variables or neither. Setting only one fails startup.
      # The proxy is the security boundary; see docs/security.md.
      # DSH_PROXY_USER: "admin"
      # DSH_PROXY_PASSWORD: "replace-with-a-strong-password"
    volumes:
      - dsh-home:/home/dsh
      # Host-visible alternative (owner must be uid 1000; keep :Z on SELinux):
      #   mkdir -p home && sudo chown -R 1000:1000 home
      #   - ./home:/home/dsh:Z
    # Optional docker-in-docker: privileged alone is not enough; dockerd must be
    # started inside the container. Mounting /var/run/docker.sock is equally
    # high-risk. Only enable either for trusted workloads.
    # privileged: true
    # Optional: change dsh's internal port (the exposed port stays 3081).
    # The entrypoint rejects --port 3081 (proxy conflict) and --port 0.
    # command: ["--port", "8080"]
    # Restart dsh web without restarting the container:
    #   docker exec dsh dsh-restart

volumes:
  dsh-home:
