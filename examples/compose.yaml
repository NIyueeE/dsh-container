# Start:   docker compose -f examples/compose.yaml up -d
# Podman:  podman-compose -f examples/compose.yaml up -d
#
# Pulls the published GHCR image; no local build is required.
# See docs/deployment.md for the full guide.
#
# Networking: plain bridge networking; the host port is published on loopback
# only (127.0.0.1:3081), so LAN/public exposure is an explicit step (see the
# ports block and docs/deployment.md "Public deployment"). dsh web listens on
# 127.0.0.1 inside the container (upstream dsh rejects --host 0.0.0.0); Caddy
# listens on 0.0.0.0:3081 and rewrites Host/Origin to loopback before forwarding
# to dsh on 127.0.0.1:3080. The proxy bootstraps the dsh browser session
# automatically (no login URL), and the image applies an idempotent client-side
# patch before each dsh web start so remote browsers can use settings/credentials.
#
# Persistence: the whole /home/dsh directory is one named volume (the user
# layer). System packages and /usr/local are replaced on image upgrades while
# user state and user-installed tools survive.

services:
  dsh:
    image: ghcr.io/niyueee/dsh-container:latest
    container_name: dsh
    restart: unless-stopped
    ports:
      # Host loopback only: reachable from the host itself (and from a host-side
      # reverse proxy such as nginx). For plain LAN access use "3081:3081" —
      # basic auth below then becomes mandatory, not optional.
      - "127.0.0.1:3081:3081"
    # Runtime configuration surface: auth pair. Set both auth variables or
    # neither. Setting only one fails startup. Loopback-only publishing (the
    # default) is safe without auth; enable basic auth before switching the
    # publish line to "3081:3081" (plain LAN) or exposing the host proxy
    # publicly. The proxy is the security boundary; see docs/security.md.
    # environment:
    #   DSH_PROXY_USER: "admin"
    #   DSH_PROXY_PASSWORD: "replace-with-a-strong-password"
    volumes:
      - dsh-home:/home/dsh
      # Host-visible alternative (owner must be uid 1000; keep :Z on SELinux):
      #   mkdir -p home && sudo chown -R 1000:1000 home
      #   - ./home:/home/dsh:Z
    # Optional docker-in-docker: privileged alone is not enough; dockerd must be
    # started inside the container. Mounting /var/run/docker.sock is equally
    # high-risk. Only enable either for trusted workloads.
    # privileged: true
    # Optional: change dsh's internal port (the exposed port stays 3081).
    # The entrypoint rejects --port 3081 (proxy conflict) and --port 0.
    # command: ["--port", "8080"]
    # Restart dsh web without restarting the container:
    #   docker exec dsh dsh-restart

volumes:
  dsh-home:
